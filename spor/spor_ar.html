<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spor AR — Alman Sporu</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; font-family:'Arial',sans-serif; }
    a-scene { width:100vw!important; height:100vh!important; position:fixed!important; top:0!important; left:0!important; }

    #ui { position:fixed; inset:0; pointer-events:none; z-index:1000; }

    #status {
      position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
      background:rgba(8,5,2,.88); color:#d4b483; font-size:.60rem;
      letter-spacing:.28em; text-transform:uppercase; padding:.5rem 1.3rem;
      border:1px solid rgba(200,160,90,.28); backdrop-filter:blur(14px);
      white-space:nowrap; display:flex; align-items:center; gap:.55rem;
      animation:blink 2.5s ease infinite;
    }
    #status.found { color:#9ec87a; border-color:rgba(140,200,90,.35); animation:none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

    .sbar { width:34px; height:2px; background:rgba(200,160,90,.18); position:relative; overflow:hidden; border-radius:2px; }
    .sbar-fill { position:absolute; top:0; left:-100%; width:100%; height:100%; background:#c9a84c; animation:slide 2s linear infinite; }
    #status.found .sbar-fill { background:#9ec87a; animation:none; width:100%; left:0; }
    @keyframes slide { 0%{left:-100%} 100%{left:100%} }

    #back {
      position:absolute; top:16px; left:50%; transform:translateX(-50%);
      background:rgba(8,5,2,.88); color:#d4b483;
      border:1px solid rgba(200,160,90,.28); padding:.45rem 1.3rem;
      font-size:.60rem; letter-spacing:.22em; text-transform:uppercase;
      cursor:pointer; pointer-events:all; backdrop-filter:blur(14px); font-family:Arial,sans-serif;
    }
    #tap-hint {
      position:absolute; top:66px; left:50%; transform:translateX(-50%);
      color:rgba(212,180,131,.55); font-size:.58rem; letter-spacing:.25em;
      text-transform:uppercase; display:none; animation:blink 2s ease infinite;
    }

    #info-card {
      position:absolute; bottom:72px; left:50%;
      transform:translateX(-50%) translateY(300px);
      width:min(380px,92vw);
      background:rgba(10,6,2,.93); border:1px solid rgba(195,158,88,.42);
      backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
      padding:1.3rem 1.5rem;
      transition:transform .42s cubic-bezier(.16,1,.3,1), opacity .42s ease;
      opacity:0; pointer-events:none;
    }
    #info-card.show { transform:translateX(-50%) translateY(0); opacity:1; pointer-events:all; }
    .ic-tag { font-size:.54rem; letter-spacing:.35em; text-transform:uppercase; color:#c9a84c; margin-bottom:.42rem; display:flex; align-items:center; gap:.5rem; }
    .ic-tag::after { content:''; flex:1; height:1px; background:rgba(195,158,88,.2); }
    .ic-title { font-size:1.28rem; font-weight:700; color:#f2e8d4; margin-bottom:.22rem; }
    .ic-sub { font-size:.68rem; color:#b08840; letter-spacing:.1em; margin-bottom:.65rem; }
    .ic-text { font-size:.79rem; color:rgba(242,232,212,.68); line-height:1.68; }
    .ic-close { position:absolute; top:.6rem; right:.8rem; color:rgba(195,158,88,.45); cursor:pointer; font-size:.9rem; pointer-events:all; background:none; border:none; font-family:Arial; }
    .ic-close:hover { color:#c9a84c; }
  </style>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- IŞIKLAR — stadyum atmosferi: sıcak beyaz + serin mavi -->
  <a-light type="ambient"     color="#c8b890" intensity="0.55"></a-light>
  <!-- Ana spot — üstten sağdan parlak beyaz -->
  <a-light type="directional" color="#fff8f0" intensity="1.20" position="1.5 3 1.5"></a-light>
  <!-- Serin mavi dolgu — soldan -->
  <a-light type="directional" color="#6090d8" intensity="0.30" position="-2 1 0.5"></a-light>
  <!-- Stadyum taban aydınlatması — sıcak noktasal -->
  <a-light type="point"       color="#ffe8c0" intensity="0.40" position="0 1 0.8" distance="4"></a-light>
  <!-- Sağ kenar dolgusu -->
  <a-light type="directional" color="#a0c0e0" intensity="0.18" position="2 0.5 -1"></a-light>

  <a-camera position="0 0 0" look-controls="enabled: false"
    cursor="fuse: false; rayOrigin: mouse"
    raycaster="objects: .hotspot; far: 100">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- ══════════════════════════════════════════
         SAHNE ZEMİNİ — koyu stadyum platformu
    ══════════════════════════════════════════ -->
    <a-cylinder position="0 -0.42 0" radius="0.75" height="0.010"
      color="#0a0c10" material="roughness:1; metalness:0">
    </a-cylinder>
    <!-- Platform kenar çizgisi — mavi -->
    <a-torus position="0 -0.415 0" radius="0.73" radius-tubular="0.004"
      color="#0055aa" material="roughness:0.5; metalness:0; emissive:#001844; emissiveIntensity:0.9">
    </a-torus>
    <!-- İç platform halka çizgisi — altın -->
    <a-torus position="0 -0.414 0" radius="0.50" radius-tubular="0.002"
      color="#c9a84c" material="roughness:0.4; metalness:0.3; emissive:#4a3810; emissiveIntensity:0.6">
    </a-torus>

    <!-- ══════════════════════════════════════════
         FUTBOL TOPU — sol taraf, hafif zıplama
    ══════════════════════════════════════════ -->
    <a-entity position="-0.30 -0.18 0.05"
      animation="property: position; from: -0.30 -0.18 0.05; to: -0.30 -0.14 0.05; dur: 1800; easing: easeInOutSine; loop: true; dir: alternate">

      <!-- Ana küre — top gövdesi -->
      <a-sphere class="hotspot" data-info="bundesliga"
        radius="0.095"
        color="#f0f0f0"
        material="roughness:0.82; metalness:0">
      </a-sphere>

      <!-- Siyah altıgen yama — üst merkez -->
      <a-box position="0 0.080 0.050" width="0.040" height="0.040" depth="0.005"
        color="#111111" material="roughness:0.9; metalness:0">
      </a-box>
      <!-- Siyah yama — sol üst -->
      <a-box position="-0.055 0.052 0.068" width="0.036" height="0.036" depth="0.005"
        color="#111111" material="roughness:0.9; metalness:0" rotation="0 25 15">
      </a-box>
      <!-- Siyah yama — sağ üst -->
      <a-box position="0.055 0.052 0.068" width="0.036" height="0.036" depth="0.005"
        color="#111111" material="roughness:0.9; metalness:0" rotation="0 -25 -15">
      </a-box>
      <!-- Siyah yama — sol orta -->
      <a-box position="-0.082 0.010 0.042" width="0.034" height="0.034" depth="0.005"
        color="#111111" material="roughness:0.9; metalness:0" rotation="0 40 0">
      </a-box>
      <!-- Siyah yama — sağ orta -->
      <a-box position="0.082 0.010 0.042" width="0.034" height="0.034" depth="0.005"
        color="#111111" material="roughness:0.9; metalness:0" rotation="0 -40 0">
      </a-box>

      <!-- Top gölgesi (zeminde) -->
      <a-cylinder position="0 -0.095 0" radius="0.080" height="0.003"
        color="#000000" material="roughness:1; metalness:0; transparent:true; opacity:0.35">
      </a-cylinder>

      <a-text value="BUNDESLIGA" align="center" position="0 0.175 0"
        scale="0.062 0.062 0.062" color="#c9a84c" material="depthTest:false">
      </a-text>
      <a-text value="Fußball · Deutschland" align="center" position="0 0.142 0"
        scale="0.038 0.038 0.038" color="rgba(195,158,88,0.60)" material="depthTest:false">
      </a-text>

    </a-entity>

    <!-- ══════════════════════════════════════════
         KUPA — merkez, yavaş dönen
    ══════════════════════════════════════════ -->
    <a-entity position="0.05 -0.10 0.02"
      animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 8000; easing: linear; loop: true">

      <!-- Kupa alt kaidesi (geniş) -->
      <a-cylinder class="hotspot" data-info="nationalteam"
        radius="0.062" height="0.018"
        color="#c9a84c"
        material="roughness:0.30; metalness:0.80; emissive:#3a2a08; emissiveIntensity:0.5"
        position="0 -0.155 0">
      </a-cylinder>
      <!-- Kupa kaide orta katmanı -->
      <a-cylinder radius="0.048" height="0.014"
        color="#b8942a"
        material="roughness:0.28; metalness:0.82"
        position="0 -0.138 0">
      </a-cylinder>
      <!-- Kupa sap gövdesi (ince) -->
      <a-cylinder radius="0.018" height="0.090"
        color="#c9a84c"
        material="roughness:0.25; metalness:0.85"
        position="0 -0.095 0">
      </a-cylinder>
      <!-- Sap genişleyen üst bağlantı -->
      <a-cylinder radius="0.032" height="0.016"
        color="#b8942a"
        material="roughness:0.28; metalness:0.82"
        position="0 -0.046 0">
      </a-cylinder>
      <!-- Kupa gövdesi (kase) — alttan dar, üsten geniş -->
      <a-cone radius-bottom="0.052" radius-top="0.095" height="0.130"
        color="#c9a84c"
        material="roughness:0.22; metalness:0.88; emissive:#3a2a08; emissiveIntensity:0.35"
        position="0 0.030 0">
      </a-cone>
      <!-- Kupa üst rim (geniş halka) -->
      <a-torus radius="0.095" radius-tubular="0.010"
        color="#d4b050"
        material="roughness:0.20; metalness:0.90; emissive:#4a3410; emissiveIntensity:0.4"
        position="0 0.096 0" rotation="90 0 0">
      </a-torus>
      <!-- Kupa sol sapı -->
      <a-torus radius="0.038" radius-tubular="0.008"
        color="#b8942a"
        material="roughness:0.25; metalness:0.85"
        position="-0.118 0.040 0" rotation="0 90 0">
      </a-torus>
      <!-- Kupa sağ sapı -->
      <a-torus radius="0.038" radius-tubular="0.008"
        color="#b8942a"
        material="roughness:0.25; metalness:0.85"
        position="0.118 0.040 0" rotation="0 90 0">
      </a-torus>
      <!-- Kupa üstü parlak yüzey -->
      <a-cylinder radius="0.085" height="0.004"
        color="#e0c060"
        material="roughness:0.15; metalness:0.95; emissive:#503808; emissiveIntensity:0.3"
        position="0 0.098 0">
      </a-cylinder>
      <!-- Kupa yıldız süsü -->
      <a-cylinder radius="0.014" height="0.028"
        color="#ffe080"
        material="roughness:0.15; metalness:0.95; emissive:#604010; emissiveIntensity:0.6"
        position="0 0.118 0">
      </a-cylinder>

      <a-text value="NATIONALMANNSCHAFT" align="center" position="0 0.230 0"
        scale="0.052 0.052 0.052" color="#c9a84c" material="depthTest:false">
      </a-text>
      <a-text value="1954 · 1974 · 1990 · 2014" align="center" position="0 0.198 0"
        scale="0.036 0.036 0.036" color="rgba(195,158,88,0.60)" material="depthTest:false">
      </a-text>

    </a-entity>

    <!-- ══════════════════════════════════════════
         FORMULA 1 ARABASI — sağ taraf, hafif sallantı
    ══════════════════════════════════════════ -->
    <a-entity position="0.34 -0.30 0.05"
      animation="property: rotation; from: 0 -8 0; to: 0 8 0; dur: 3500; easing: easeInOutSine; loop: true; dir: alternate">

      <!-- F1 gövdesi (ana uzun kutu) — kırmızı Ferrari -->
      <a-box class="hotspot" data-info="schumacher"
        width="0.280" height="0.040" depth="0.090"
        color="#cc0000"
        material="roughness:0.25; metalness:0.55; emissive:#3a0000; emissiveIntensity:0.3"
        position="0 0 0">
      </a-box>
      <!-- Araç üst body (daha ince, alttakinin üstüne) -->
      <a-box width="0.200" height="0.025" depth="0.070"
        color="#dd0000"
        material="roughness:0.22; metalness:0.50; emissive:#3a0000; emissiveIntensity:0.25"
        position="0 0.032 0">
      </a-box>
      <!-- Kokpit bölümü -->
      <a-box width="0.060" height="0.034" depth="0.058"
        color="#111111"
        material="roughness:0.6; metalness:0.3"
        position="0.015 0.040 0">
      </a-box>
      <!-- Kask (pilot kafası — küçük yuvarlak) -->
      <a-sphere radius="0.022" scale="1 0.85 1"
        color="#ffffff"
        material="roughness:0.35; metalness:0.2"
        position="0.015 0.062 0">
      </a-sphere>
      <!-- Kask vizörü -->
      <a-box width="0.030" height="0.012" depth="0.024"
        color="#223344"
        material="roughness:0.10; metalness:0.6; transparent:true; opacity:0.80"
        position="0.030 0.065 0">
      </a-box>

      <!-- Sol ön tekerlek -->
      <a-cylinder radius="0.022" height="0.028"
        color="#222222"
        material="roughness:0.85; metalness:0.1"
        position="-0.105 -0.022 0.055" rotation="0 0 90">
      </a-cylinder>
      <!-- Sağ ön tekerlek -->
      <a-cylinder radius="0.022" height="0.028"
        color="#222222"
        material="roughness:0.85; metalness:0.1"
        position="-0.105 -0.022 -0.055" rotation="0 0 90">
      </a-cylinder>
      <!-- Sol arka tekerlek -->
      <a-cylinder radius="0.026" height="0.032"
        color="#222222"
        material="roughness:0.85; metalness:0.1"
        position="0.095 -0.018 0.060" rotation="0 0 90">
      </a-cylinder>
      <!-- Sağ arka tekerlek -->
      <a-cylinder radius="0.026" height="0.032"
        color="#222222"
        material="roughness:0.85; metalness:0.1"
        position="0.095 -0.018 -0.060" rotation="0 0 90">
      </a-cylinder>

      <!-- Ön kanat (flat box, geniş) -->
      <a-box width="0.040" height="0.008" depth="0.180"
        color="#cc0000"
        material="roughness:0.22; metalness:0.50"
        position="-0.130 -0.010 0">
      </a-box>
      <!-- Ön kanat uç plakalar -->
      <a-box width="0.040" height="0.025" depth="0.008"
        color="#cc0000"
        material="roughness:0.22; metalness:0.50"
        position="-0.130 0 0.090">
      </a-box>
      <a-box width="0.040" height="0.025" depth="0.008"
        color="#cc0000"
        material="roughness:0.22; metalness:0.50"
        position="-0.130 0 -0.090">
      </a-box>

      <!-- Arka kanat (yüksek spoiler) -->
      <a-box width="0.010" height="0.055" depth="0.005"
        color="#111111"
        material="roughness:0.5; metalness:0.3"
        position="0.125 0.020 0.048">
      </a-box>
      <a-box width="0.010" height="0.055" depth="0.005"
        color="#111111"
        material="roughness:0.5; metalness:0.3"
        position="0.125 0.020 -0.048">
      </a-box>
      <!-- Arka kanat üst plakası -->
      <a-box width="0.040" height="0.008" depth="0.110"
        color="#cc0000"
        material="roughness:0.22; metalness:0.50"
        position="0.125 0.048 0">
      </a-box>

      <!-- Ferrari logosu (sarı nokta) -->
      <a-cylinder radius="0.006" height="0.002"
        color="#ffcc00"
        material="roughness:0.2; metalness:0.5; emissive:#554400; emissiveIntensity:0.4"
        position="-0.060 0.041 0" rotation="90 0 0">
      </a-cylinder>

      <!-- Egzoz boruları -->
      <a-cylinder radius="0.006" height="0.040"
        color="#555555"
        material="roughness:0.4; metalness:0.8"
        position="0.108 0.012 0.025" rotation="0 0 90">
      </a-cylinder>
      <a-cylinder radius="0.006" height="0.040"
        color="#555555"
        material="roughness:0.4; metalness:0.8"
        position="0.108 0.012 -0.025" rotation="0 0 90">
      </a-cylinder>

      <a-text value="SCHUMACHER" align="center" position="0 0.140 0"
        scale="0.058 0.058 0.058" color="#c9a84c" material="depthTest:false">
      </a-text>
      <a-text value="7x Weltmeister · Ferrari" align="center" position="0 0.108 0"
        scale="0.036 0.036 0.036" color="rgba(195,158,88,0.60)" material="depthTest:false">
      </a-text>

    </a-entity>

    <!-- ══════════════════════════════════════════
         STADYUM ARKA DUVAR / ARKA FON
    ══════════════════════════════════════════ -->
    <a-plane position="0 0.10 -0.60" width="1.60" height="0.90"
      color="#050810" material="roughness:1; metalness:0">
    </a-plane>
    <!-- Stadyum ışık çizgileri (üst) -->
    <a-box position="0 0.520 -0.594" width="1.580" height="0.006" depth="0.002"
      color="#0044aa" material="emissive:#001844; emissiveIntensity:1.0">
    </a-box>
    <!-- Stadyum alt ışık çizgisi -->
    <a-box position="0 -0.330 -0.594" width="1.580" height="0.004" depth="0.002"
      color="#0044aa" material="emissive:#001844; emissiveIntensity:0.8">
    </a-box>
    <!-- Stadyum sol dikey dirsek -->
    <a-box position="-0.780 0.095 -0.594" width="0.005" height="0.860" depth="0.002"
      color="#0033aa" material="emissive:#001233; emissiveIntensity:0.7">
    </a-box>
    <!-- Stadyum sağ dikey dirsek -->
    <a-box position="0.780 0.095 -0.594" width="0.005" height="0.860" depth="0.002"
      color="#0033aa" material="emissive:#001233; emissiveIntensity:0.7">
    </a-box>

    <!-- ══════════════════════════════════════════
         SKOR TABLOSU — arka duvar üstü
    ══════════════════════════════════════════ -->
    <a-entity position="0 0.38 -0.58">
      <a-text value="BUNDESLIGA" align="center" position="0 0 0"
        scale="0.065 0.065 0.065" color="#c9a84c"
        material="depthTest:false; emissive:#3a2808; emissiveIntensity:0.5">
      </a-text>
      <a-text value="DEUTSCHLAND · SPORT · MEISTERSCHAFT" align="center" position="0 -0.048 0"
        scale="0.030 0.030 0.030" color="rgba(195,158,88,0.55)"
        material="depthTest:false">
      </a-text>
      <a-box position="0 -0.060 0" width="0.420" height="0.002" depth="0.001"
        color="#c9a84c" material="emissive:#4a3410; emissiveIntensity:0.7">
      </a-box>
    </a-entity>

  </a-entity>
</a-scene>

<div id="ui">
  <div id="tap-hint"></div>
  <div id="status">
    <div class="sbar"><div class="sbar-fill"></div></div>
    <span id="status-text"></span>
  </div>
  <button id="back" onclick="window.location.href='index.html'"></button>
  <div id="info-card">
    <button class="ic-close" onclick="closeCard()">&#x2715;</button>
    <div class="ic-tag" id="ic-tag"></div>
    <div class="ic-title" id="ic-title"></div>
    <div class="ic-sub" id="ic-sub"></div>
    <div class="ic-text" id="ic-text"></div>
  </div>
</div>

<script>
  var lang = localStorage.getItem('lang') || 'tr';

  var infos = {

        text: "Die Bundesliga ist die höchste Fußballliga Deutschlands, gegründet 1963. Mit 18 Vereinen hat die Liga den höchsten durchschnittlichen Zuschauerkapazitätswert der Welt. Bayern München hält mit 32 Meisterschaften den Rekord."

    },
    nationalteam: {

        text: "Michael Schumacher, Formula 1 tarihinin tartışmasız en büyük pilotlarından biridir. Ferrari ile birlikte 2000-2004 yılları arasında 5 üst üste dünya şampiyonluğu kazanmıştır. Toplam 91 galibiyetiyle efsane olmuştur."

  };

  var uiTexts = {
    tr: { status: 'Taraniyor...', found: '\u2713 Hedef Bulundu \u2014 Dokun', hint: '\u25B2 Objelere Dokun', back: '\u2190 Geri D\u00f6n' },
    de: { status: 'Wird gescannt...', found: '\u2713 Ziel erkannt \u2014 Antippen', hint: '\u25B2 Objekte antippen', back: '\u2190 Zur\u00fcck' }
  };

  var statusEl   = document.getElementById('status');
  var statusText = document.getElementById('status-text');
  var tapHint    = document.getElementById('tap-hint');
  var backBtn    = document.getElementById('back');
  var card       = document.getElementById('info-card');

  statusText.textContent = uiTexts[lang].status;
  tapHint.textContent    = uiTexts[lang].hint;
  backBtn.textContent    = uiTexts[lang].back;

  var target = document.querySelector('[mindar-image-target]');
  target.addEventListener('targetFound', function () {
    statusText.textContent = uiTexts[lang].found;
    statusEl.classList.add('found');
    tapHint.style.display = 'block';
  });
  target.addEventListener('targetLost', function () {
    statusText.textContent = uiTexts[lang].status;
    statusEl.classList.remove('found');
    tapHint.style.display = 'none';
    closeCard();
  });

  document.querySelectorAll('.hotspot').forEach(function (hs) {
    hs.addEventListener('click', function () {
      var key = hs.getAttribute('data-info');
      if (!key || !infos[key]) return;
      var data = infos[key][lang];
      document.getElementById('ic-tag').textContent   = data.tag;
      document.getElementById('ic-title').textContent = data.title;
      document.getElementById('ic-sub').textContent   = data.sub;
      document.getElementById('ic-text').textContent  = data.text;
      card.classList.add('show');
    });
  });

  function closeCard() { card.classList.remove('show'); }
</script>
</body>
</html>
