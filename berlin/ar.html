<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Berlin AR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
    .c { position: absolute; width: 40px; height: 40px; }
    .c-tl { top:16px; left:16px; border-top:2px solid #00d4ff; border-left:2px solid #00d4ff; }
    .c-tr { top:16px; right:16px; border-top:2px solid #00d4ff; border-right:2px solid #00d4ff; }
    .c-bl { bottom:70px; left:16px; border-bottom:2px solid #00d4ff; border-left:2px solid #00d4ff; }
    .c-br { bottom:70px; right:16px; border-bottom:2px solid #00d4ff; border-right:2px solid #00d4ff; }
    .scan { position:absolute; left:0; right:0; height:1px; background:linear-gradient(to right,transparent,#00d4ff,transparent); animation:scan 3s ease-in-out infinite; opacity:.5; }
    @keyframes scan { 0%{top:10%} 50%{top:90%} 100%{top:10%} }
    #status { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#00d4ff; font-size:.62rem; letter-spacing:.3em; text-transform:uppercase; padding:.5rem 1.2rem; border:1px solid rgba(0,212,255,.35); backdrop-filter:blur(10px); white-space:nowrap; animation:blink 2s ease infinite; }
    #status.found { color:#00ff88; border-color:rgba(0,255,136,.4); animation:none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
    #back { position:absolute; top:16px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#00d4ff; border:1px solid rgba(0,212,255,.35); padding:.45rem 1.2rem; font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; pointer-events:all; backdrop-filter:blur(10px); font-family:Arial,sans-serif; }
    #tap-hint { position:absolute; top:70px; left:50%; transform:translateX(-50%); color:rgba(0,212,255,.65); font-size:.6rem; letter-spacing:.25em; text-transform:uppercase; display:none; animation:blink 2s ease infinite; }
    #info-card { position:absolute; bottom:70px; left:50%; transform:translateX(-50%) translateY(220px); width:min(340px, 90vw); background:rgba(0,8,22,.93); border:1px solid rgba(0,212,255,.5); backdrop-filter:blur(20px); padding:1.2rem 1.5rem; transition:transform .4s cubic-bezier(.16,1,.3,1), opacity .4s ease; opacity:0; pointer-events:none; }
    #info-card.show { transform:translateX(-50%) translateY(0); opacity:1; pointer-events:all; }
    .ic-tag { font-size:.55rem; letter-spacing:.35em; text-transform:uppercase; color:#00d4ff; margin-bottom:.4rem; display:flex; align-items:center; gap:.5rem; }
    .ic-tag::after { content:''; flex:1; height:1px; background:rgba(0,212,255,.25); }
    .ic-title { font-size:1.25rem; font-weight:700; color:#e8f4f8; margin-bottom:.25rem; }
    .ic-sub { font-size:.7rem; color:#00d4ff; letter-spacing:.1em; margin-bottom:.65rem; }
    .ic-text { font-size:.8rem; color:rgba(232,244,248,.7); line-height:1.65; }
    .ic-close { position:absolute; top:.6rem; right:.8rem; color:rgba(0,212,255,.5); cursor:pointer; font-size:.9rem; pointer-events:all; background:none; border:none; font-family:Arial; }
    .ic-close:hover { color:#00d4ff; }
  </style>
</head>
<body>
<a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false" embedded>

  <a-entity mindar-image-target="targetIndex: 0">
    <a-torus position="0 -0.38 0" radius="0.58" radius-tubular="0.004" color="#00d4ff" opacity="0.5" animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true"></a-torus>
    <a-torus position="0 -0.38 0" radius="0.42" radius-tubular="0.002" color="#00d4ff" opacity="0.3" animation="property: rotation; to: 0 -360 0; dur: 7000; easing: linear; loop: true"></a-torus>

    <a-box position="-0.165 -0.21 0" width="0.022" height="0.34" depth="0.022" color="#00d4ff" opacity="0.85" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.35"></a-box>
    <a-box position="-0.11  -0.21 0" width="0.022" height="0.34" depth="0.022" color="#00d4ff" opacity="0.85" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.35"></a-box>
    <a-box position="-0.055 -0.21 0" width="0.022" height="0.34" depth="0.022" color="#00d4ff" opacity="0.85" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.35"></a-box>
    <a-box position="0     -0.21 0" width="0.022" height="0.34" depth="0.022" color="#00d4ff" opacity="0.85" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.35"></a-box>
    <a-box position="0.055 -0.21 0" width="0.022" height="0.34" depth="0.022" color="#00d4ff" opacity="0.85" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.35"></a-box>
    <a-box position="0.11  -0.21 0" width="0.022" height="0.34" depth="0.022" color="#00d4ff" opacity="0.85" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.35"></a-box>
    <a-box position="0.165 -0.21 0" width="0.022" height="0.34" depth="0.022" color="#00d4ff" opacity="0.85" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.35"></a-box>
    <a-box position="0 -0.035 0" width="0.4" height="0.028" depth="0.075" color="#00d4ff" opacity="0.65" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.2"></a-box>
    <a-box position="0 0.024 0" width="0.3" height="0.055" depth="0.055" color="#00aadd" opacity="0.55" material="transparent:true"></a-box>
    <a-cone position="0 0.1 0" radius-bottom="0.065" radius-top="0.01" height="0.07" color="#c9a84c" opacity="0.9" material="transparent:true; emissive:#c9a84c; emissiveIntensity:0.5" animation="property: position; from: 0 0.09 0; to: 0 0.11 0; dur: 2000; easing: easeInOutSine; loop: true; dir: alternate"></a-cone>
    <a-box position="-0.265 -0.25 0" width="0.09" height="0.26" depth="0.055" color="#001e3c" opacity="0.7" material="transparent:true"></a-box>
    <a-box position="0.265  -0.25 0" width="0.09" height="0.26" depth="0.055" color="#001e3c" opacity="0.7" material="transparent:true"></a-box>
    <a-cylinder position="0.44 -0.19 -0.04" radius="0.011" height="0.43" color="#00d4ff" opacity="0.7" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.3"></a-cylinder>
    <a-sphere   position="0.44  0.04 -0.04" radius="0.038" color="#00d4ff" opacity="0.6" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.35"></a-sphere>
    <a-cylinder position="0.44  0.16 -0.04" radius="0.005" height="0.12" color="#00d4ff" opacity="0.9" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.6"></a-cylinder>
    <a-sphere   position="0.44  0.22 -0.04" radius="0.007" color="#ff3333" opacity="1" material="transparent:true; emissive:#ff3333; emissiveIntensity:1" animation="property: material.opacity; from:1; to:0.1; dur:700; easing:easeInOutSine; loop:true; dir:alternate"></a-sphere>
    <a-box    position="-0.31 -0.27 0.02" width="0.13" height="0.22" depth="0.09" color="#001e3c" opacity="0.65" material="transparent:true"></a-box>
    <a-sphere position="-0.31 -0.13 0.02" radius="0.038" color="#00aadd" opacity="0.5" material="transparent:true; emissive:#00aadd; emissiveIntensity:0.25"></a-sphere>
    <a-box position="-0.51 -0.28 -0.02" width="0.055" height="0.18" depth="0.055" color="#001122" opacity="0.65" material="transparent:true"></a-box>
    <a-box position="-0.43 -0.30 0"     width="0.048" height="0.14" depth="0.048" color="#001122" opacity="0.55" material="transparent:true"></a-box>
    <a-box position="0.34  -0.30 0.05"  width="0.058" height="0.15" depth="0.058" color="#001122" opacity="0.6"  material="transparent:true"></a-box>
    <a-box position="0.54  -0.29 0.02"  width="0.065" height="0.17" depth="0.065" color="#001122" opacity="0.6"  material="transparent:true"></a-box>
    <a-text value="BERLIN" align="center" position="0 0.28 0" scale="0.36 0.36 0.36" color="#00d4ff" material="emissive:#00d4ff; emissiveIntensity:0.5" animation="property: position; from: 0 0.26 0; to: 0 0.30 0; dur: 2500; easing: easeInOutSine; loop: true; dir: alternate"></a-text>
    <a-text value="52 31 N  13 24 E" align="center" position="0 0.21 0" scale="0.11 0.11 0.11" color="rgba(0,180,220,0.7)"></a-text>
    <a-sphere class="hotspot" position="0 0.07 0.01" radius="0.026" color="#00d4ff" material="emissive:#00d4ff; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.4 1.4 1.4; dur:1000; easing:easeInOutSine; loop:true; dir:alternate" data-title="Brandenburger Tor" data-sub="Symbol der Freiheit · 1791" data-text="1791'de inşa edilen Brandenburg Kapısı Almanya'nın özgürlük ve birlik sembolüdür. 1989'da Duvar yıkılınca milyonlarca insan bu kapı önünde kutlama yaptı. Quadriga heykeli dört at ve bir zafer tanrıçasını tasvir eder." data-tag="Tarihi Yapı · 1791"></a-sphere>
    <a-torus position="0 0.07 0.01" radius="0.042" radius-tubular="0.003" color="#00d4ff" opacity="0.35" animation="property: scale; from:1 1 1; to:2 2 2; dur:1500; easing:easeOutQuad; loop:true"></a-torus>
    <a-text value="[ TOR ]" align="center" position="0 0.155 0.01" scale="0.075 0.075 0.075" color="#00d4ff"></a-text>
    <a-sphere class="hotspot" position="0.44 0.24 -0.04" radius="0.023" color="#00ff88" material="emissive:#00ff88; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.5 1.5 1.5; dur:800; easing:easeInOutSine; loop:true; dir:alternate; delay:300" data-title="Fernsehturm" data-sub="TV Kulesi · 368 Metre · 1969" data-text="Berlin'in en yüksek yapısı olan Fernsehturm, Doğu Almanya döneminde inşa edildi. 368 metre yüksekliğiyle şehrin her noktasından görünür. Üst kattaki Sphere adlı restoranda dönen teras eşsiz manzara sunar." data-tag="Mimari · 368m"></a-sphere>
    <a-text value="[ TURM ]" align="center" position="0.44 0.31 -0.04" scale="0.075 0.075 0.075" color="#00ff88"></a-text>
    <a-sphere class="hotspot" position="-0.31 -0.04 0.02" radius="0.023" color="#c9a84c" material="emissive:#c9a84c; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.4 1.4 1.4; dur:1200; easing:easeInOutSine; loop:true; dir:alternate; delay:600" data-title="Museumsinsel" data-sub="UNESCO Dünya Mirası · 1999" data-text="Spree Nehri'ndeki bu adada 5 dünya müzesi bulunur: Pergamon, Bode, Neues, Altes ve Alte Nationalgalerie. Her yıl 3 milyondan fazla ziyaretçi çeker. UNESCO tarafından 1999'da Dünya Mirası ilan edildi." data-tag="Kültür · UNESCO"></a-sphere>
    <a-text value="[ DOM ]" align="center" position="-0.31 0.03 0.02" scale="0.075 0.075 0.075" color="#c9a84c"></a-text>
    <a-sphere class="hotspot" position="0.34 -0.19 0.05" radius="0.023" color="#ff6b6b" material="emissive:#ff6b6b; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.4 1.4 1.4; dur:900; easing:easeInOutSine; loop:true; dir:alternate; delay:900" data-title="East Side Gallery" data-sub="Açık Hava Galerisi · 1.3km" data-text="1989'da yıkılan Berlin Duvarı'nın kalan 1.3 km'lik bölümü dünyasının en büyük açık hava galerisidir. 105 sanatçının 106 eseri bu duvarda yaşıyor. 'Fraternal Kiss' tablosu dünyanın en çok fotoğraflanan grafitisidir." data-tag="Tarih · Sanat"></a-sphere>
    <a-text value="[ MAUER ]" align="center" position="0.34 -0.12 0.05" scale="0.075 0.075 0.075" color="#ff6b6b"></a-text>
    <a-sphere class="hotspot" position="-0.47 -0.19 0" radius="0.023" color="#aa88ff" material="emissive:#aa88ff; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.5 1.5 1.5; dur:1100; easing:easeInOutSine; loop:true; dir:alternate; delay:1200" data-title="Potsdamer Platz" data-sub="Modern Berlin'in Kalbi" data-text="Soğuk Savaş döneminde Doğu-Batı sınırında çorak bir arazi olan Potsdamer Platz, 1990'larda Avrupa'nın en büyük inşaat alanına dönüştü. Sony Center ve modern gökdelenlerle yeniden doğdu." data-tag="Modern Şehir"></a-sphere>
    <a-text value="[ PLATZ ]" align="center" position="-0.47 -0.12 0" scale="0.075 0.075 0.075" color="#aa88ff"></a-text>

    <a-sphere position="0.18 0 -0.1" radius="0.004" color="#00d4ff" opacity="0.5" material="transparent:true" animation="property: position; from:0.18 -0.38 -0.1; to:0.18 0.12 -0.1; dur:4000; easing:easeInOutSine; loop:true; dir:alternate; delay:500"></a-sphere>
    <a-sphere position="0.05 0.1 0.18" radius="0.004" color="#c9a84c" opacity="0.7" material="transparent:true" animation="property: position; from:0.05 -0.38 0.18; to:0.05 0.22 0.18; dur:2500; easing:easeInOutSine; loop:true; dir:alternate; delay:1000"></a-sphere>
    <a-sphere position="0.32 0 0.02" radius="0.004" color="#00ff88" opacity="0.5" material="transparent:true" animation="property: position; from:0.32 -0.38 0.02; to:0.32 0.08 0.02; dur:3500; easing:easeInOutSine; loop:true; dir:alternate; delay:1500"></a-sphere>
  </a-entity>
</a-scene>
<div id="ui">
  <div class="c c-tl"></div><div class="c c-tr"></div><div class="c c-bl"></div><div class="c c-br"></div>
  <div class="scan"></div>
  <div id="tap-hint">▲ Noktalara Dokun</div>
  <div id="status">Taranıyor...</div>
  <button id="back" onclick="window.location.href='index.html'">← Geri Dön</button>
  <div id="info-card">
    <button class="ic-close" onclick="closeCard()">✕</button>
    <div class="ic-tag" id="ic-tag"></div>
    <div class="ic-title" id="ic-title"></div>
    <div class="ic-sub" id="ic-sub"></div>
    <div class="ic-text" id="ic-text"></div>
  </div>
</div>
<script>
  const target = document.querySelector('[mindar-image-target]');
  const statusEl = document.getElementById('status');
  const tapHint = document.getElementById('tap-hint');
  const card = document.getElementById('info-card');
  target.addEventListener('targetFound', () => { statusEl.textContent = '✓ Hedef Bulundu — Noktalara Dokun'; statusEl.classList.add('found'); tapHint.style.display = 'block'; });
  target.addEventListener('targetLost', () => { statusEl.textContent = 'Taranıyor...'; statusEl.classList.remove('found'); tapHint.style.display = 'none'; closeCard(); });
  document.querySelectorAll('.hotspot').forEach(hs => {
    hs.addEventListener('click', () => {
      document.getElementById('ic-tag').textContent = hs.dataset.tag;
      document.getElementById('ic-title').textContent = hs.dataset.title;
      document.getElementById('ic-sub').textContent = hs.dataset.sub;
      document.getElementById('ic-text').textContent = hs.dataset.text;
      card.classList.add('show');
    });
  });
  function closeCard() { card.classList.remove('show'); }
</script>
</body>
</html>
