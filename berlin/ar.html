<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Berlin AR</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body { overflow: hidden; font-family: 'Arial', sans-serif; }

    #ui-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 1000;
    }

    /* Corner brackets */
    .corner {
      position: absolute;
      width: 50px;
      height: 50px;
    }
    .corner-tl { top: 20px; left: 20px; border-top: 2px solid #00d4ff; border-left: 2px solid #00d4ff; }
    .corner-tr { top: 20px; right: 20px; border-top: 2px solid #00d4ff; border-right: 2px solid #00d4ff; }
    .corner-bl { bottom: 80px; left: 20px; border-bottom: 2px solid #00d4ff; border-left: 2px solid #00d4ff; }
    .corner-br { bottom: 80px; right: 20px; border-bottom: 2px solid #00d4ff; border-right: 2px solid #00d4ff; }

    /* Scan line */
    .scan-line {
      position: absolute;
      left: 0; right: 0;
      height: 2px;
      background: linear-gradient(to right, transparent, #00d4ff, transparent);
      animation: scan 2.5s ease-in-out infinite;
      opacity: 0.7;
    }
    @keyframes scan {
      0%   { top: 15%; }
      50%  { top: 85%; }
      100% { top: 15%; }
    }

    /* Status */
    #status {
      position: absolute;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #00d4ff;
      font-size: 0.75rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      padding: 0.6rem 1.5rem;
      border: 1px solid rgba(0,212,255,0.4);
      backdrop-filter: blur(10px);
      white-space: nowrap;
      animation: blink 2s ease infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.5} }

    #status.found {
      color: #00ff88;
      border-color: rgba(0,255,136,0.4);
      animation: none;
    }

    /* Close button */
    #close-btn {
      position: absolute;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #00d4ff;
      border: 1px solid rgba(0,212,255,0.4);
      padding: 0.5rem 1.5rem;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      pointer-events: all;
      backdrop-filter: blur(10px);
      font-family: Arial, sans-serif;
    }

    /* Target hint */
    #hint {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: rgba(0,212,255,0.5);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      pointer-events: none;
    }

    #hint .hint-box {
      width: 200px;
      height: 140px;
      border: 1px dashed rgba(0,212,255,0.3);
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
    }
  </style>
</head>
<body>

  <!-- A-Frame AR Scene -->
  <a-scene
    mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
    color-space="sRGB"
    renderer="colorManagement: true; physicallyCorrectLights: true"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
  >
    <a-assets>
      <img id="marker-img" src="marker.jpg"/>
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- AR Target: Brandenburg Gate marker -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- Background panel -->
      <a-plane
        position="0 0 0"
        width="1" height="0.65"
        color="#00060f"
        opacity="0.88"
        material="transparent: true"
      ></a-plane>

      <!-- Border frame - top -->
      <a-plane position="0 0.325 0.001" width="1" height="0.005" color="#00d4ff" opacity="0.8"></a-plane>
      <!-- Border frame - bottom -->
      <a-plane position="0 -0.325 0.001" width="1" height="0.005" color="#00d4ff" opacity="0.8"></a-plane>
      <!-- Border frame - left -->
      <a-plane position="-0.5 0 0.001" width="0.005" height="0.65" color="#00d4ff" opacity="0.8"></a-plane>
      <!-- Border frame - right -->
      <a-plane position="0.5 0 0.001" width="0.005" height="0.65" color="#00d4ff" opacity="0.8"></a-plane>

      <!-- BERLIN title -->
      <a-text
        value="BERLIN"
        align="center"
        position="0 0.2 0.002"
        scale="0.55 0.55 0.55"
        color="#00d4ff"
        font="https://cdn.aframe.io/fonts/Exo2Bold.fnt"
      ></a-text>

      <!-- Subtitle -->
      <a-text
        value="Hauptstadt Deutschlands"
        align="center"
        position="0 0.1 0.002"
        scale="0.18 0.18 0.18"
        color="#c9a84c"
      ></a-text>

      <!-- Divider -->
      <a-plane position="0 0.06 0.002" width="0.8" height="0.003" color="#00d4ff" opacity="0.4"></a-plane>

      <!-- Coordinates -->
      <a-text
        value="52 31 N  13 24 E"
        align="center"
        position="0 0.02 0.002"
        scale="0.14 0.14 0.14"
        color="rgba(0,212,255,0.7)"
      ></a-text>

      <!-- Info line 1 -->
      <a-text
        value="Brandenburger Tor  |  Fernsehturm"
        align="center"
        position="0 -0.07 0.002"
        scale="0.12 0.12 0.12"
        color="#e8f4f8"
      ></a-text>

      <!-- Info line 2 -->
      <a-text
        value="Museumsinsel  |  East Side Gallery"
        align="center"
        position="0 -0.13 0.002"
        scale="0.12 0.12 0.12"
        color="#e8f4f8"
      ></a-text>

      <!-- Divider 2 -->
      <a-plane position="0 -0.185 0.002" width="0.8" height="0.003" color="#00d4ff" opacity="0.4"></a-plane>

      <!-- Population data -->
      <a-text
        value="3.7M Einwohner  |  892km2  |  Gründung 1237"
        align="center"
        position="0 -0.245 0.002"
        scale="0.1 0.1 0.1"
        color="rgba(0,212,255,0.6)"
      ></a-text>

      <!-- Animated scanning plane -->
      <a-plane
        position="0 0 0.003"
        width="1" height="0.006"
        color="#00d4ff"
        opacity="0.5"
        animation="property: position; from: 0 0.32 0.003; to: 0 -0.32 0.003; dur: 2000; easing: linear; loop: true"
      ></a-plane>

    </a-entity>
  </a-scene>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <div class="corner corner-tl"></div>
    <div class="corner corner-tr"></div>
    <div class="corner corner-bl"></div>
    <div class="corner corner-br"></div>
    <div class="scan-line"></div>

    <div id="hint">
      <div class="hint-box">📸</div>
      Fotoğrafa tut
    </div>

    <div id="status">Taranıyor...</div>
    <button id="close-btn" onclick="window.location.href='index.html'">← Geri Dön</button>
  </div>

  <script>
    const sceneEl = document.querySelector('a-scene');

    sceneEl.addEventListener('arReady', () => {
      console.log('MindAR ready');
    });

    sceneEl.addEventListener('arError', (e) => {
      document.getElementById('status').textContent = 'Hata: ' + e.detail;
    });

    const target = document.querySelector('[mindar-image-target]');

    target.addEventListener('targetFound', () => {
      document.getElementById('status').textContent = '✓ Hedef Bulundu';
      document.getElementById('status').classList.add('found');
      document.getElementById('hint').style.display = 'none';
    });

    target.addEventListener('targetLost', () => {
      document.getElementById('status').textContent = 'Taranıyor...';
      document.getElementById('status').classList.remove('found');
      document.getElementById('hint').style.display = 'block';
    });
  </script>
</body>
</html>
