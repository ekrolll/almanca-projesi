<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feste AR — Deutschland Entdecken</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
    a-scene { width: 100vw !important; height: 100vh !important; position: fixed !important; top: 0 !important; left: 0 !important; }

    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
    .c { position: absolute; width: 40px; height: 40px; }
    .c-tl { top:16px; left:16px; border-top:2px solid #00d4ff; border-left:2px solid #00d4ff; }
    .c-tr { top:16px; right:16px; border-top:2px solid #00d4ff; border-right:2px solid #00d4ff; }
    .c-bl { bottom:70px; left:16px; border-bottom:2px solid #00d4ff; border-left:2px solid #00d4ff; }
    .c-br { bottom:70px; right:16px; border-bottom:2px solid #00d4ff; border-right:2px solid #00d4ff; }
    .scan { position:absolute; left:0; right:0; height:1px; background:linear-gradient(to right,transparent,#00d4ff,transparent); animation:scan 3s ease-in-out infinite; opacity:.5; }
    @keyframes scan { 0%{top:10%} 50%{top:90%} 100%{top:10%} }

    #status { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#00d4ff; font-size:.62rem; letter-spacing:.3em; text-transform:uppercase; padding:.5rem 1.2rem; border:1px solid rgba(0,212,255,.35); backdrop-filter:blur(10px); white-space:nowrap; animation:blink 2s ease infinite; display:flex; align-items:center; gap:0.5rem; }
    #status.found { color:#00ff88; border-color:rgba(0,255,136,.4); animation:none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
    .status-bar { width:40px; height:3px; background:rgba(0,212,255,0.2); position:relative; overflow:hidden; border-radius:2px; }
    .status-bar-fill { position:absolute; top:0; left:-100%; width:100%; height:100%; background:#00d4ff; animation:barSlide 2s linear infinite; }
    #status.found .status-bar-fill { background:#00ff88; animation:none; width:100%; left:0; }
    @keyframes barSlide { 0%{left:-100%} 100%{left:100%} }

    #back { position:absolute; top:16px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#00d4ff; border:1px solid rgba(0,212,255,.35); padding:.45rem 1.2rem; font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; pointer-events:all; backdrop-filter:blur(10px); font-family:Arial,sans-serif; }
    #tap-hint { position:absolute; top:70px; left:50%; transform:translateX(-50%); color:rgba(0,212,255,.65); font-size:.6rem; letter-spacing:.25em; text-transform:uppercase; display:none; animation:blink 2s ease infinite; }

    #info-card { position:absolute; bottom:70px; left:50%; transform:translateX(-50%) translateY(260px); width:min(360px, 92vw); background:rgba(0,8,22,.93); border:1px solid rgba(0,212,255,.5); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); padding:1.2rem 1.5rem; transition:transform .4s cubic-bezier(.16,1,.3,1), opacity .4s ease; opacity:0; pointer-events:none; }
    #info-card.show { transform:translateX(-50%) translateY(0); opacity:1; pointer-events:all; }
    .ic-tag { font-size:.55rem; letter-spacing:.35em; text-transform:uppercase; color:#00d4ff; margin-bottom:.4rem; display:flex; align-items:center; gap:.5rem; }
    .ic-tag::after { content:''; flex:1; height:1px; background:rgba(0,212,255,.25); }
    .ic-title { font-size:1.25rem; font-weight:700; color:#e8f4f8; margin-bottom:.25rem; }
    .ic-sub { font-size:.7rem; color:#00d4ff; letter-spacing:.1em; margin-bottom:.65rem; }
    .ic-text { font-size:.8rem; color:rgba(232,244,248,.7); line-height:1.65; }
    .ic-close { position:absolute; top:.6rem; right:.8rem; color:rgba(0,212,255,.5); cursor:pointer; font-size:.9rem; pointer-events:all; background:none; border:none; font-family:Arial; }
    .ic-close:hover { color:#00d4ff; }
  </style>
</head>
<body>

<a-scene mindar-image="imageTargetSrc: target.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .hotspot; far: 100"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- Platform & Rings -->
    <a-torus position="0 -0.38 0" radius="0.58" radius-tubular="0.004" color="#00d4ff" opacity="0.5" animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true"></a-torus>
    <a-torus position="0 -0.38 0" radius="0.42" radius-tubular="0.002" color="#00d4ff" opacity="0.3" animation="property: rotation; to: 0 -360 0; dur: 7000; easing: linear; loop: true"></a-torus>
    <a-cylinder position="0 -0.382 0" radius="0.58" height="0.008" color="#00d4ff" opacity="0.12" material="transparent:true"></a-cylinder>

    <!-- Tent -->
    <a-cone position="0 -0.05 0" radius-bottom="0.32" radius-top="0.02" height="0.26" color="#00d4ff" opacity="0.7" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.2"></a-cone>
    <a-box position="0 -0.23 0" width="0.55" height="0.2" depth="0.28" color="#003322" opacity="0.65" material="transparent:true"></a-box>
    <a-cone position="0 0.1 0" radius-bottom="0.025" radius-top="0.01" height="0.06" color="#c9a84c" opacity="0.9" material="transparent:true; emissive:#c9a84c; emissiveIntensity:0.5" animation="property: position; from: 0 0.09 0; to: 0 0.11 0; dur: 2000; easing: easeInOutSine; loop: true; dir: alternate"></a-cone>

    <!-- Beer mugs -->
    <a-cylinder position="-0.44 -0.22 0" radius="0.05" height="0.22" color="#00aacc" opacity="0.8" material="transparent:true; emissive:#00aacc; emissiveIntensity:0.3"></a-cylinder>
    <a-cylinder position="-0.44 -0.1 0" radius="0.05" height="0.03" color="#aaffff" opacity="0.6" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.5" animation="property: material.opacity; from:0.6; to:1; dur:800; easing:easeInOutSine; loop:true; dir:alternate"></a-cylinder>
    <a-cylinder position="0.44 -0.22 0" radius="0.05" height="0.22" color="#00aacc" opacity="0.8" material="transparent:true; emissive:#00aacc; emissiveIntensity:0.3"></a-cylinder>
    <a-cylinder position="0.44 -0.1 0" radius="0.05" height="0.03" color="#aaffff" opacity="0.6" material="transparent:true; emissive:#00d4ff; emissiveIntensity:0.5" animation="property: material.opacity; from:1; to:0.6; dur:800; easing:easeInOutSine; loop:true; dir:alternate"></a-cylinder>

    <!-- Ferris wheel -->
    <a-torus position="0.48 -0.05 -0.05" radius="0.18" radius-tubular="0.005" color="#00d4ff" opacity="0.5" animation="property: rotation; from: 0 0 0; to: 0 0 360; dur: 8000; easing: linear; loop: true"></a-torus>
    <a-cylinder position="0.48 -0.25 -0.05" radius="0.006" height="0.22" color="#00d4ff" opacity="0.6" material="transparent:true"></a-cylinder>

    <!-- Christmas tree -->
    <a-cone position="-0.46 -0.12 -0.04" radius-bottom="0.1" radius-top="0.01" height="0.26" color="#00aa44" opacity="0.7" material="transparent:true; emissive:#007722; emissiveIntensity:0.2"></a-cone>
    <a-cylinder position="-0.46 -0.28 -0.04" radius="0.018" height="0.06" color="#663300" opacity="0.8" material="transparent:true"></a-cylinder>
    <a-sphere position="-0.46 0.02 -0.04" radius="0.016" color="#00d4ff" opacity="1" material="transparent:true; emissive:#00d4ff; emissiveIntensity:1" animation="property: material.opacity; from:1; to:0.3; dur:600; easing:easeInOutSine; loop:true; dir:alternate"></a-sphere>

    <!-- Particles -->
    <a-sphere position="-0.25 -0.1 0.1" radius="0.005" color="#00d4ff" opacity="0.6" material="transparent:true" animation="property: position; from:-0.25 -0.38 0.1; to:-0.25 0.18 0.1; dur:3000; easing:easeInOutSine; loop:true; dir:alternate"></a-sphere>
    <a-sphere position="0.18 0 -0.1" radius="0.004" color="#00d4ff" opacity="0.5" material="transparent:true" animation="property: position; from:0.18 -0.38 -0.1; to:0.18 0.12 -0.1; dur:4000; easing:easeInOutSine; loop:true; dir:alternate; delay:500"></a-sphere>
    <a-sphere position="0.05 0.1 0.18" radius="0.004" color="#c9a84c" opacity="0.7" material="transparent:true" animation="property: position; from:0.05 -0.38 0.18; to:0.05 0.22 0.18; dur:2500; easing:easeInOutSine; loop:true; dir:alternate; delay:1000"></a-sphere>
    <a-sphere position="0.32 0 0.02" radius="0.004" color="#00ff88" opacity="0.5" material="transparent:true" animation="property: position; from:0.32 -0.38 0.02; to:0.32 0.08 0.02; dur:3500; easing:easeInOutSine; loop:true; dir:alternate; delay:1500"></a-sphere>

    <!-- Title -->
    <a-text value="FESTE &amp; FEIERN" align="center" position="0 0.28 0" scale="0.32 0.32 0.32" color="#00d4ff" material="emissive:#00d4ff; emissiveIntensity:0.5" animation="property: position; from: 0 0.26 0; to: 0 0.30 0; dur: 2500; easing: easeInOutSine; loop: true; dir: alternate"></a-text>
    <a-text value="Munchen - Koln - Nurnberg" align="center" position="0 0.21 0" scale="0.11 0.11 0.11" color="rgba(0,180,220,0.7)"></a-text>

    <!-- 5 Hotspots -->
    <a-sphere class="hotspot" position="0 0.07 0.01" radius="0.026" color="#00d4ff" material="emissive:#00d4ff; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.4 1.4 1.4; dur:1000; easing:easeInOutSine; loop:true; dir:alternate" data-person="oktoberfest"></a-sphere>
    <a-torus position="0 0.07 0.01" radius="0.042" radius-tubular="0.003" color="#00d4ff" opacity="0.35" animation="property: scale; from:1 1 1; to:2 2 2; dur:1500; easing:easeOutQuad; loop:true"></a-torus>
    <a-text value="[ OKTOBERFEST ]" align="center" position="0 0.155 0.01" scale="0.07 0.07 0.07" color="#00d4ff"></a-text>

    <a-sphere class="hotspot" position="0.44 0.14 -0.05" radius="0.023" color="#00ff88" material="emissive:#00ff88; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.5 1.5 1.5; dur:800; easing:easeInOutSine; loop:true; dir:alternate; delay:300" data-person="schutzenfest"></a-sphere>
    <a-text value="[ SCHUTZEN ]" align="center" position="0.44 0.21 -0.05" scale="0.07 0.07 0.07" color="#00ff88"></a-text>

    <a-sphere class="hotspot" position="-0.46 0.04 -0.04" radius="0.023" color="#c9a84c" material="emissive:#c9a84c; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.4 1.4 1.4; dur:1200; easing:easeInOutSine; loop:true; dir:alternate; delay:600" data-person="weihnacht"></a-sphere>
    <a-text value="[ WEIHNACHT ]" align="center" position="-0.46 0.11 -0.04" scale="0.07 0.07 0.07" color="#c9a84c"></a-text>

    <a-sphere class="hotspot" position="-0.44 -0.14 0" radius="0.023" color="#ff6b6b" material="emissive:#ff6b6b; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.4 1.4 1.4; dur:900; easing:easeInOutSine; loop:true; dir:alternate; delay:900" data-person="karneval"></a-sphere>
    <a-text value="[ KARNEVAL ]" align="center" position="-0.44 -0.07 0" scale="0.07 0.07 0.07" color="#ff6b6b"></a-text>

    <a-sphere class="hotspot" position="0.44 -0.14 0.05" radius="0.023" color="#aa88ff" material="emissive:#aa88ff; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.5 1.5 1.5; dur:1100; easing:easeInOutSine; loop:true; dir:alternate; delay:1200" data-person="berlinale"></a-sphere>
    <a-text value="[ BERLINALE ]" align="center" position="0.44 -0.07 0.05" scale="0.07 0.07 0.07" color="#aa88ff"></a-text>

  </a-entity>
</a-scene>

<div id="ui">
  <div class="c c-tl"></div><div class="c c-tr"></div><div class="c c-bl"></div><div class="c c-br"></div>
  <div class="scan"></div>
  <div id="tap-hint"></div>
  <div id="status">
    <div class="status-bar"><div class="status-bar-fill"></div></div>
    <span id="status-text"></span>
  </div>
  <button id="back" onclick="window.location.href='index.html'"></button>
  <div id="info-card">
    <button class="ic-close" onclick="closeCard()">&#x2715;</button>
    <div class="ic-tag" id="ic-tag"></div>
    <div class="ic-title" id="ic-title"></div>
    <div class="ic-sub" id="ic-sub"></div>
    <div class="ic-text" id="ic-text"></div>
  </div>
</div>

<script>
  var lang = localStorage.getItem('lang') || 'tr';

  var festivals = {
    oktoberfest: {
      tr: { tag:'Dunyanin En Buyuk Festivali', title:'Oktoberfest', sub:"Munih \u00b7 Eylul\u2013Ekim \u00b7 1810'dan beri", text:"1810'dan beri her yil Munih'te duzenlenen Oktoberfest dunyanin en buyuk halk festivalidir. Her yil 6 milyondan fazla ziyaretci ceker. 14 buyuk cadir, geleneksel Bavyera muzigi ve yemekleri esliginde kutlama yapilir." },
      de: { tag:'Gr\u00f6\u00dftes Volksfest der Welt', title:'Oktoberfest', sub:'M\u00fcnchen \u00b7 September\u2013Oktober \u00b7 Seit 1810', text:'Das seit 1810 j\u00e4hrlich in M\u00fcnchen stattfindende Oktoberfest ist das gr\u00f6\u00dfte Volksfest der Welt. Es zieht jedes Jahr \u00fcber 6 Millionen Besucher an. 14 gro\u00dfe Festzelte mit traditioneller bayerischer Musik und K\u00fcche.' }
    },
    schutzenfest: {
      tr: { tag:'Geleneksel Festival', title:'Sch\u00fctzenfest', sub:'Hannover \u00b7 Temmuz', text:"Hannover Sch\u00fctzenfest dunyanin en buyuk nisancilik festivalidir. Her yil Temmuz'da 10 gunluk kutlamalar yapilir. Geleneksel Alman kiyafetleri, muzik ve atis yarismalariyla 1 milyondan fazla kisi katilir." },
      de: { tag:'Traditionelles Fest', title:'Sch\u00fctzenfest', sub:'Hannover \u00b7 Juli', text:'Das Hannoversche Sch\u00fctzenfest ist das gr\u00f6\u00dfte Sch\u00fctzenfest der Welt. Jedes Jahr im Juli finden 10-t\u00e4gige Feierlichkeiten statt. Mit traditioneller Kleidung, Musik und Schie\u00dfwettbewerben nehmen \u00fcber 1 Million Menschen teil.' }
    },
    weihnacht: {
      tr: { tag:'Noel Pazarlari', title:'Weihnachtsmarkt', sub:"Nurnberg, Dresden, Koln \u00b7 Aralik", text:"600 yili askin gelenegiyle Almanya Noel pazarlari dunyanin en guzel kis etkinlikleri arasindadir. Nurnberg, Dresden ve Koln'deki pazarlar her yil milyonlarca ziyaretci ceker. Gluhwein, Lebkuchen ve isil isil suslemeler." },
      de: { tag:'Weihnachtsm\u00e4rkte', title:'Weihnachtsmarkt', sub:'N\u00fcrnberg, Dresden, K\u00f6ln \u00b7 Dezember', text:'Mit \u00fcber 600-j\u00e4hriger Tradition geh\u00f6ren die deutschen Weihnachtsm\u00e4rkte zu den sch\u00f6nsten Winterveranstaltungen der Welt. Die M\u00e4rkte in N\u00fcrnberg, Dresden und K\u00f6ln ziehen j\u00e4hrlich Millionen Besucher an. Gl\u00fchwein, Lebkuchen und funkelnde Dekoration.' }
    },
    karneval: {
      tr: { tag:'Renkli Karnaval', title:'Karneval', sub:"Koln, Dusseldorf, Mainz \u00b7 Subat\u2013Mart", text:"Koln Karnavali Almanya'nin en buyuk karnvalidir. Her yil 1 milyondan fazla kisi renkli kostumler ve gecit torenleriyle kutlama yapar. 'Kolle Alaaf!' nidasi sehri sariyor. Fasching doneminin zirvesidir." },
      de: { tag:'Bunter Karneval', title:'Karneval', sub:'K\u00f6ln, D\u00fcsseldorf, Mainz \u00b7 Februar\u2013M\u00e4rz', text:'Der K\u00f6lner Karneval ist Deutschlands gr\u00f6\u00dfter Karneval. Jedes Jahr feiern \u00fcber 1 Million Menschen mit bunten Kost\u00fcmen und Umz\u00fcgen. "K\u00f6lle Alaaf!" schallt durch die Stadt. H\u00f6hepunkt der Faschingszeit.' }
    },
    berlinale: {
      tr: { tag:'Film Festivali', title:'Berlinale', sub:'Berlin \u00b7 Subat', text:"Berlin Uluslararasi Film Festivali, Cannes ve Venedik ile birlikte dunyanin uc buyuk film festivalinden biridir. Her yil Subat'ta duzenlenen festivalde 300'den fazla film gosterilir. Altin Ayi odulu sinema dunyasinin en prestijli odulleri arasindadir." },
      de: { tag:'Filmfestspiele', title:'Berlinale', sub:'Berlin \u00b7 Februar', text:'Die Internationalen Filmfestspiele Berlin sind neben Cannes und Venedig eines der drei gro\u00dfen Filmfestivals der Welt. Jedes Jahr im Februar werden \u00fcber 300 Filme gezeigt. Der Goldene B\u00e4r geh\u00f6rt zu den prestigetr\u00e4chtigsten Auszeichnungen der Filmwelt.' }
    }
  };

  var uiTexts = {
    tr: { status:'Taraniyor...', found:'\u2713 Hedef Bulundu \u2014 Noktalara Dokun', hint:'\u25B2 Noktalara Dokun', back:'\u2190 Geri Don' },
    de: { status:'Wird gescannt...', found:'\u2713 Ziel erkannt \u2014 Punkte antippen', hint:'\u25B2 Punkte antippen', back:'\u2190 Zur\u00fcck' }
  };

  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('status-text');
  var tapHint = document.getElementById('tap-hint');
  var backBtn = document.getElementById('back');
  var card = document.getElementById('info-card');

  statusText.textContent = uiTexts[lang].status;
  tapHint.textContent = uiTexts[lang].hint;
  backBtn.textContent = uiTexts[lang].back;

  var target = document.querySelector('[mindar-image-target]');
  target.addEventListener('targetFound', function() {
    statusText.textContent = uiTexts[lang].found;
    statusEl.classList.add('found');
    tapHint.style.display = 'block';
  });
  target.addEventListener('targetLost', function() {
    statusText.textContent = uiTexts[lang].status;
    statusEl.classList.remove('found');
    tapHint.style.display = 'none';
    closeCard();
  });

  document.querySelectorAll('.hotspot').forEach(function(hs) {
    hs.addEventListener('click', function() {
      var key = hs.getAttribute('data-person');
      if (!key || !festivals[key]) return;
      var data = festivals[key][lang];
      document.getElementById('ic-tag').textContent = data.tag;
      document.getElementById('ic-title').textContent = data.title;
      document.getElementById('ic-sub').textContent = data.sub;
      document.getElementById('ic-text').textContent = data.text;
      card.classList.add('show');
    });
  });

  function closeCard() { card.classList.remove('show'); }
</script>
</body>
</html>
