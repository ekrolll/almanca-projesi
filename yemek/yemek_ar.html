<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Berliner AR — Deutsche Küche</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; font-family:'Arial',sans-serif; }
    a-scene { width:100vw!important; height:100vh!important; position:fixed!important; top:0!important; left:0!important; }

    #ui { position:fixed; inset:0; pointer-events:none; z-index:1000; }

    #status {
      position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
      background:rgba(8,5,2,.88); color:#d4b483; font-size:.60rem;
      letter-spacing:.28em; text-transform:uppercase; padding:.5rem 1.3rem;
      border:1px solid rgba(200,160,90,.28); backdrop-filter:blur(14px);
      white-space:nowrap; display:flex; align-items:center; gap:.55rem;
      animation:blink 2.5s ease infinite;
    }
    #status.found { color:#9ec87a; border-color:rgba(140,200,90,.35); animation:none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

    .sbar { width:34px; height:2px; background:rgba(200,160,90,.18); position:relative; overflow:hidden; border-radius:2px; }
    .sbar-fill { position:absolute; top:0; left:-100%; width:100%; height:100%; background:#c9a84c; animation:slide 2s linear infinite; }
    #status.found .sbar-fill { background:#9ec87a; animation:none; width:100%; left:0; }
    @keyframes slide { 0%{left:-100%} 100%{left:100%} }

    #back {
      position:absolute; top:16px; left:50%; transform:translateX(-50%);
      background:rgba(8,5,2,.88); color:#d4b483;
      border:1px solid rgba(200,160,90,.28); padding:.45rem 1.3rem;
      font-size:.60rem; letter-spacing:.22em; text-transform:uppercase;
      cursor:pointer; pointer-events:all; backdrop-filter:blur(14px); font-family:Arial,sans-serif;
    }
    #tap-hint {
      position:absolute; top:66px; left:50%; transform:translateX(-50%);
      color:rgba(212,180,131,.55); font-size:.58rem; letter-spacing:.25em;
      text-transform:uppercase; display:none; animation:blink 2s ease infinite;
    }

    #info-card {
      position:absolute; bottom:72px; left:50%;
      transform:translateX(-50%) translateY(280px);
      width:min(360px,92vw);
      background:rgba(10,6,2,.93); border:1px solid rgba(195,158,88,.42);
      backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
      padding:1.3rem 1.5rem;
      transition:transform .42s cubic-bezier(.16,1,.3,1), opacity .42s ease;
      opacity:0; pointer-events:none;
    }
    #info-card.show { transform:translateX(-50%) translateY(0); opacity:1; pointer-events:all; }
    .ic-tag { font-size:.54rem; letter-spacing:.35em; text-transform:uppercase; color:#c9a84c; margin-bottom:.42rem; display:flex; align-items:center; gap:.5rem; }
    .ic-tag::after { content:''; flex:1; height:1px; background:rgba(195,158,88,.2); }
    .ic-title { font-size:1.28rem; font-weight:700; color:#f2e8d4; margin-bottom:.22rem; }
    .ic-sub { font-size:.68rem; color:#b08840; letter-spacing:.1em; margin-bottom:.65rem; }
    .ic-text { font-size:.79rem; color:rgba(242,232,212,.68); line-height:1.68; }
    .ic-close { position:absolute; top:.6rem; right:.8rem; color:rgba(195,158,88,.45); cursor:pointer; font-size:.9rem; pointer-events:all; background:none; border:none; font-family:Arial; }
    .ic-close:hover { color:#c9a84c; }
  </style>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- IŞIKLAR -->
  <a-light type="ambient"     color="#c8a878" intensity="0.50"></a-light>
  <a-light type="directional" color="#fff6e8" intensity="1.05" position="1.2 2.2 1.5"></a-light>
  <a-light type="directional" color="#8ab0d8" intensity="0.22" position="-1.5 0.8 0.8"></a-light>
  <a-light type="point"       color="#ffe8c0" intensity="0.35" position="0 0.8 0.5" distance="3"></a-light>

  <a-camera position="0 0 0" look-controls="enabled: false"
    cursor="fuse: false; rayOrigin: mouse"
    raycaster="objects: .hotspot; far: 100">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- ══════════════════════════════════════════
         MASA — koyu meşe ahşap
    ══════════════════════════════════════════ -->
    <a-cylinder position="0 -0.400 0" radius="0.55" height="0.008"
      color="#18100600" material="shader:flat; color:#1a0f07">
    </a-cylinder>
    <!-- Ahşap doku efekti: ince paralel çizgiler -->
    <a-cylinder position="0 -0.396 0" radius="0.54" height="0.001"
      color="#221408" material="roughness:1; metalness:0; transparent:true; opacity:0.55">
    </a-cylinder>

    <!-- ══════════════════════════════════════════
         TABAK — gerçekçi porselen
    ══════════════════════════════════════════ -->

    <!-- Tabak alt gövde (kalın, hafif konik) -->
    <a-cylinder position="0 -0.346 0" radius="0.265" height="0.022"
      color="#F4F0EA"
      material="roughness:0.86; metalness:0">
    </a-cylinder>

    <!-- Dış rim şişkinliği (torus) -->
    <a-torus position="0 -0.336 0" radius="0.252" radius-tubular="0.013"
      color="#EDE5D5"
      material="roughness:0.88; metalness:0">
    </a-torus>

    <!-- İç düzlem (tabak çukuru) -->
    <a-cylinder position="0 -0.334 0" radius="0.200" height="0.003"
      color="#FAFAF6"
      material="roughness:0.80; metalness:0">
    </a-cylinder>

    <!-- İç kenar ince çizgi -->
    <a-torus position="0 -0.333 0" radius="0.200" radius-tubular="0.003"
      color="#D8D0C0"
      material="roughness:0.84; metalness:0">
    </a-torus>

    <!-- Tabak altı (görünür düzlem) -->
    <a-cylinder position="0 -0.357 0" radius="0.240" height="0.002"
      color="#E8E2D8"
      material="roughness:0.90; metalness:0">
    </a-cylinder>

    <!-- ══════════════════════════════════════════
         ÇATAL — sol, paslanmaz çelik
    ══════════════════════════════════════════ -->
    <a-entity position="-0.345 -0.310 0.005" rotation="0 0 6">

      <!-- Sap alt kısmı (yuvarlak köşeli) -->
      <a-cylinder position="0 -0.062 0" radius="0.0055" height="0.150"
        color="#C8C8C8" material="roughness:0.16; metalness:0.94">
      </a-cylinder>
      <!-- Sap hafif oval şekli için ince kutu üste -->
      <a-box position="0 -0.062 0" width="0.011" height="0.150" depth="0.003"
        color="#CCCCCC" material="roughness:0.16; metalness:0.92">
      </a-box>
      <!-- Sap-diş geçiş bölgesi (kalın) -->
      <a-cylinder position="0 0.022 0" radius="0.007" height="0.018"
        color="#BABABA" material="roughness:0.20; metalness:0.90">
      </a-cylinder>
      <!-- 4 diş (gerçekçi çatal) -->
      <a-cylinder position="-0.0120 0.065 0" radius="0.0020" height="0.055"
        color="#D8D8D8" material="roughness:0.12; metalness:0.96">
      </a-cylinder>
      <a-cylinder position="-0.0040 0.065 0" radius="0.0020" height="0.058"
        color="#D8D8D8" material="roughness:0.12; metalness:0.96">
      </a-cylinder>
      <a-cylinder position="0.0040 0.065 0" radius="0.0020" height="0.058"
        color="#D8D8D8" material="roughness:0.12; metalness:0.96">
      </a-cylinder>
      <a-cylinder position="0.0120 0.065 0" radius="0.0020" height="0.055"
        color="#D8D8D8" material="roughness:0.12; metalness:0.96">
      </a-cylinder>
      <!-- Diş uç yuvarlamaları -->
      <a-sphere position="-0.0120 0.092 0" radius="0.0022" color="#D0D0D0" material="roughness:0.12; metalness:0.96"></a-sphere>
      <a-sphere position="-0.0040 0.094 0" radius="0.0022" color="#D0D0D0" material="roughness:0.12; metalness:0.96"></a-sphere>
      <a-sphere position="0.0040 0.094 0" radius="0.0022" color="#D0D0D0" material="roughness:0.12; metalness:0.96"></a-sphere>
      <a-sphere position="0.0120 0.092 0" radius="0.0022" color="#D0D0D0" material="roughness:0.12; metalness:0.96"></a-sphere>
      <!-- Sap alt yuvarlama -->
      <a-sphere position="0 -0.138 0" radius="0.006" color="#C4C4C4" material="roughness:0.18; metalness:0.92"></a-sphere>

    </a-entity>

    <!-- ══════════════════════════════════════════
         BIÇAK — sağ, paslanmaz çelik
    ══════════════════════════════════════════ -->
    <a-entity position="0.345 -0.310 0.005" rotation="0 0 -6">

      <!-- Sap -->
      <a-cylinder position="0 -0.062 0" radius="0.0055" height="0.150"
        color="#C8C8C8" material="roughness:0.16; metalness:0.94">
      </a-cylinder>
      <a-box position="0 -0.062 0" width="0.011" height="0.150" depth="0.003"
        color="#CCCCCC" material="roughness:0.16; metalness:0.92">
      </a-box>
      <!-- Bolster (sap-ağız birleşim) -->
      <a-cylinder position="0 0.022 0" radius="0.0085" height="0.016"
        color="#A8A8A8" material="roughness:0.22; metalness:0.92">
      </a-cylinder>
      <!-- Bıçak ağzı — asimetrik: bir yan düz, öbür yan hafif eğimli -->
      <a-box position="0.001 0.070 0" width="0.011" height="0.058" depth="0.0026"
        color="#DCDCDC" material="roughness:0.08; metalness:0.97">
      </a-box>
      <!-- Ağız sırtı (kalın kenar) -->
      <a-box position="-0.003 0.070 0" width="0.003" height="0.058" depth="0.0026"
        color="#C2C2C2" material="roughness:0.12; metalness:0.95">
      </a-box>
      <!-- Uç -->
      <a-sphere position="0.001 0.098 0" radius="0.004" color="#D4D4D4" material="roughness:0.10; metalness:0.96"></a-sphere>
      <!-- Sap alt yuvarlama -->
      <a-sphere position="0 -0.138 0" radius="0.006" color="#C4C4C4" material="roughness:0.18; metalness:0.92"></a-sphere>

    </a-entity>

    <!-- ══════════════════════════════════════════
         BERLİNER — çok detaylı, gerçekçi
    ══════════════════════════════════════════ -->
    <a-entity position="0 -0.285 0"
      animation="property: position; from: 0 -0.285 0; to: 0 -0.268 0; dur: 3000; easing: easeInOutSine; loop: true; dir: alternate">

      <!-- Ana hamur gövdesi — yassılaştırılmış küre, altın kahve -->
      <a-sphere class="hotspot" data-person="berliner"
        radius="0.080" scale="1 0.60 1"
        color="#C4802E"
        material="roughness:0.90; metalness:0">
      </a-sphere>

      <!-- Alt yüzey (tabakla temas, biraz daha düz) -->
      <a-cylinder position="0 -0.035 0" radius="0.072" height="0.004"
        color="#B06820"
        material="roughness:0.94; metalness:0">
      </a-cylinder>

      <!-- Pişme çizgisi (ortada yatay şerit — Berliner'in tipik izi) -->
      <a-torus position="0 0.002 0" radius="0.075" radius-tubular="0.0045"
        color="#9A5615"
        material="roughness:0.92; metalness:0"
        rotation="90 0 0">
      </a-torus>

      <!-- Üst hafif kabarıklık (pişme tümsek) -->
      <a-sphere position="0 0.020 0" radius="0.060" scale="1 0.28 1"
        color="#C88030"
        material="roughness:0.88; metalness:0">
      </a-sphere>

      <!-- Pudra şekeri katmanı — üst yüzey, beyaz mat -->
      <a-cylinder position="0 0.030 0" radius="0.070" height="0.005"
        color="#F8F8F4"
        material="roughness:0.98; metalness:0; transparent:true; opacity:0.88">
      </a-cylinder>
      <!-- Pudra şekeri hafif taşma kenarı -->
      <a-torus position="0 0.028 0" radius="0.068" radius-tubular="0.006"
        color="#F0F0EC"
        material="roughness:0.98; metalness:0; transparent:true; opacity:0.72"
        rotation="90 0 0">
      </a-torus>

      <!-- Marmelat dolgu — ortada kırmızı çizgi (ortadan kesit görünümü) -->
      <a-torus position="0 0.001 0" radius="0.055" radius-tubular="0.0060"
        color="#C0250A"
        material="roughness:0.78; metalness:0"
        rotation="90 0 0">
      </a-torus>
      <!-- Marmelat kenar sızıntısı sol -->
      <a-sphere position="-0.058 0.001 0.028" radius="0.0045"
        color="#B82008" material="roughness:0.72; metalness:0">
      </a-sphere>
      <!-- Marmelat kenar sızıntısı sağ -->
      <a-sphere position="0.060 0.001 -0.020" radius="0.0040"
        color="#B82008" material="roughness:0.72; metalness:0">
      </a-sphere>

      <!-- Pudra şekeri küçük topakları -->
      <a-sphere position="0.022 0.034 0.038" radius="0.0055" color="#F5F5F2" material="roughness:0.99; metalness:0"></a-sphere>
      <a-sphere position="-0.030 0.034 0.030" radius="0.0040" color="#F2F2EE" material="roughness:0.99; metalness:0"></a-sphere>
      <a-sphere position="0.040 0.033 0.010" radius="0.0035" color="#F5F5F2" material="roughness:0.99; metalness:0"></a-sphere>
      <a-sphere position="-0.042 0.033 -0.012" radius="0.0045" color="#F2F2EE" material="roughness:0.99; metalness:0"></a-sphere>
      <a-sphere position="0.010 0.034 -0.050" radius="0.0038" color="#F5F5F2" material="roughness:0.99; metalness:0"></a-sphere>

      <!-- Etiket -->
      <a-text value="BERLINER" align="center" position="0 0.152 0"
        scale="0.072 0.072 0.072" color="#c9a84c"
        material="depthTest:false">
      </a-text>
      <a-text value="Berliner Pfannkuchen" align="center" position="0 0.122 0"
        scale="0.040 0.040 0.040" color="rgba(195,158,88,0.60)"
        material="depthTest:false">
      </a-text>

    </a-entity>

  </a-entity>
</a-scene>

<div id="ui">
  <div id="tap-hint"></div>
  <div id="status">
    <div class="sbar"><div class="sbar-fill"></div></div>
    <span id="status-text"></span>
  </div>
  <button id="back" onclick="window.location.href='index.html'"></button>
  <div id="info-card">
    <button class="ic-close" onclick="closeCard()">&#x2715;</button>
    <div class="ic-tag" id="ic-tag"></div>
    <div class="ic-title" id="ic-title"></div>
    <div class="ic-sub" id="ic-sub"></div>
    <div class="ic-text" id="ic-text"></div>
  </div>
</div>

<script>
  var lang = localStorage.getItem('lang') || 'tr';

  var foods = {
    berliner: {
      tr: {
        tag: "Berlin'in Tatlısı",
        title: 'Berliner',
        sub: 'Berlin · Pfannkuchen',
        text: "Berliner, içi marmelat veya muhallebi dolu, pudra şekerli kızartılmış bir hamur tatlısıdır. Berlin'de 'Pfannkuchen' olarak bilinir. Yılbaşı ve Karnaval dönemlerinde tüketimi zirveye ulaşır. John F. Kennedy'nin ünlü 'Ich bin ein Berliner' konuşmasıyla da tarihe geçmiştir."
      },
      de: {
        tag: 'Berliner Pfannkuchen',
        title: 'Berliner',
        sub: 'Berlin · Gefüllter Krapfen',
        text: "Der Berliner ist ein frittiertes Hefegebäck, gefüllt mit Marmelade oder Pudding, bestreut mit Puderzucker. In Berlin selbst heißt er 'Pfannkuchen'. Besonders zu Silvester und Karneval ist er sehr beliebt. John F. Kennedy machte ihn mit 'Ich bin ein Berliner' weltberühmt."
      }
    }
  };

  var uiTexts = {
    tr: { status: 'Taraniyor...', found: '\u2713 Hedef Bulundu \u2014 Dokun', hint: '\u25B2 Berliner\'e Dokun', back: '\u2190 Geri D\u00f6n' },
    de: { status: 'Wird gescannt...', found: '\u2713 Ziel erkannt \u2014 Antippen', hint: '\u25B2 Berliner antippen', back: '\u2190 Zur\u00fcck' }
  };

  var statusEl   = document.getElementById('status');
  var statusText = document.getElementById('status-text');
  var tapHint    = document.getElementById('tap-hint');
  var backBtn    = document.getElementById('back');
  var card       = document.getElementById('info-card');

  statusText.textContent = uiTexts[lang].status;
  tapHint.textContent    = uiTexts[lang].hint;
  backBtn.textContent    = uiTexts[lang].back;

  var target = document.querySelector('[mindar-image-target]');
  target.addEventListener('targetFound', function () {
    statusText.textContent = uiTexts[lang].found;
    statusEl.classList.add('found');
    tapHint.style.display = 'block';
  });
  target.addEventListener('targetLost', function () {
    statusText.textContent = uiTexts[lang].status;
    statusEl.classList.remove('found');
    tapHint.style.display = 'none';
    closeCard();
  });

  document.querySelectorAll('.hotspot').forEach(function (hs) {
    hs.addEventListener('click', function () {
      var key = hs.getAttribute('data-person');
      if (!key || !foods[key]) return;
      var data = foods[key][lang];
      document.getElementById('ic-tag').textContent   = data.tag;
      document.getElementById('ic-title').textContent = data.title;
      document.getElementById('ic-sub').textContent   = data.sub;
      document.getElementById('ic-text').textContent  = data.text;
      card.classList.add('show');
    });
  });

  function closeCard() { card.classList.remove('show'); }
</script>
</body>
</html>
