<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deutsche Küche AR — Deutschland Entdecken</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
    a-scene { width: 100vw !important; height: 100vh !important; position: fixed !important; top: 0 !important; left: 0 !important; }

    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }
    .c { position: absolute; width: 40px; height: 40px; }
    .c-tl { top:16px; left:16px; border-top:2px solid #ffb300; border-left:2px solid #ffb300; }
    .c-tr { top:16px; right:16px; border-top:2px solid #ffb300; border-right:2px solid #ffb300; }
    .c-bl { bottom:70px; left:16px; border-bottom:2px solid #ffb300; border-left:2px solid #ffb300; }
    .c-br { bottom:70px; right:16px; border-bottom:2px solid #ffb300; border-right:2px solid #ffb300; }
    .scan { position:absolute; left:0; right:0; height:1px; background:linear-gradient(to right,transparent,#ffb300,transparent); animation:scan 3s ease-in-out infinite; opacity:.5; }
    @keyframes scan { 0%{top:10%} 50%{top:90%} 100%{top:10%} }

    #status { position:absolute; bottom:16px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#ffb300; font-size:.62rem; letter-spacing:.3em; text-transform:uppercase; padding:.5rem 1.2rem; border:1px solid rgba(255,179,0,.35); backdrop-filter:blur(10px); white-space:nowrap; animation:blink 2s ease infinite; display:flex; align-items:center; gap:0.5rem; }
    #status.found { color:#00ff88; border-color:rgba(0,255,136,.4); animation:none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
    .status-bar { width:40px; height:3px; background:rgba(255,179,0,0.2); position:relative; overflow:hidden; border-radius:2px; }
    .status-bar-fill { position:absolute; top:0; left:-100%; width:100%; height:100%; background:#ffb300; animation:barSlide 2s linear infinite; }
    #status.found .status-bar-fill { background:#00ff88; animation:none; width:100%; left:0; }
    @keyframes barSlide { 0%{left:-100%} 100%{left:100%} }

    #back { position:absolute; top:16px; left:50%; transform:translateX(-50%); background:rgba(0,0,0,.85); color:#ffb300; border:1px solid rgba(255,179,0,.35); padding:.45rem 1.2rem; font-size:.62rem; letter-spacing:.2em; text-transform:uppercase; cursor:pointer; pointer-events:all; backdrop-filter:blur(10px); font-family:Arial,sans-serif; }
    #tap-hint { position:absolute; top:70px; left:50%; transform:translateX(-50%); color:rgba(255,179,0,.65); font-size:.6rem; letter-spacing:.25em; text-transform:uppercase; display:none; animation:blink 2s ease infinite; }

    #info-card { position:absolute; bottom:70px; left:50%; transform:translateX(-50%) translateY(260px); width:min(360px, 92vw); background:rgba(10,5,0,.93); border:1px solid rgba(255,179,0,.5); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); padding:1.2rem 1.5rem; transition:transform .4s cubic-bezier(.16,1,.3,1), opacity .4s ease; opacity:0; pointer-events:none; }
    #info-card.show { transform:translateX(-50%) translateY(0); opacity:1; pointer-events:all; }
    .ic-tag { font-size:.55rem; letter-spacing:.35em; text-transform:uppercase; color:#ffb300; margin-bottom:.4rem; display:flex; align-items:center; gap:.5rem; }
    .ic-tag::after { content:''; flex:1; height:1px; background:rgba(255,179,0,.25); }
    .ic-title { font-size:1.25rem; font-weight:700; color:#f8f0e0; margin-bottom:.25rem; }
    .ic-sub { font-size:.7rem; color:#ffb300; letter-spacing:.1em; margin-bottom:.65rem; }
    .ic-text { font-size:.8rem; color:rgba(248,240,224,.7); line-height:1.65; }
    .ic-close { position:absolute; top:.6rem; right:.8rem; color:rgba(255,179,0,.5); cursor:pointer; font-size:.9rem; pointer-events:all; background:none; border:none; font-family:Arial; }
    .ic-close:hover { color:#ffb300; }
  </style>
</head>
<body>

<a-scene mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;" color-space="sRGB" renderer="colorManagement: true" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
  <a-camera position="0 0 0" look-controls="enabled: false" cursor="fuse: false; rayOrigin: mouse" raycaster="objects: .hotspot; far: 100"></a-camera>
  <a-entity mindar-image-target="targetIndex: 0">

    <!-- Platform & Rings -->
    <a-torus position="0 -0.38 0" radius="0.58" radius-tubular="0.004" color="#ffb300" opacity="0.5" animation="property: rotation; to: 0 360 0; dur: 10000; easing: linear; loop: true"></a-torus>
    <a-torus position="0 -0.38 0" radius="0.42" radius-tubular="0.002" color="#c9a84c" opacity="0.3" animation="property: rotation; to: 0 -360 0; dur: 7000; easing: linear; loop: true"></a-torus>
    <a-cylinder position="0 -0.382 0" radius="0.58" height="0.008" color="#ffb300" opacity="0.1" material="transparent:true"></a-cylinder>

    <!-- Tabak (Plate) -->
    <a-cylinder position="0 -0.32 0" radius="0.3" height="0.018" color="#f5f0e8" opacity="0.92" material="transparent:true; emissive:#c9a84c; emissiveIntensity:0.08"></a-cylinder>
    <a-torus position="0 -0.31 0" radius="0.3" radius-tubular="0.008" color="#c9a84c" opacity="0.6" material="transparent:true"></a-torus>

    <!-- Cloche / Kubbe -->
    <a-sphere position="0 -0.19 0" radius="0.19" color="#00d4ff" opacity="0.08" material="transparent:true; side:back"></a-sphere>
    <a-sphere position="0 -0.19 0" radius="0.19" color="#c9a84c" opacity="0.12" material="transparent:true" animation="property: material.opacity; from:0.12; to:0.22; dur:2000; easing:easeInOutSine; loop:true; dir:alternate"></a-sphere>
    <!-- Cloche tutacak -->
    <a-cylinder position="0 -0.02 0" radius="0.018" height="0.04" color="#c9a84c" opacity="0.85" material="transparent:true; emissive:#c9a84c; emissiveIntensity:0.4" animation="property: position; from: 0 -0.025 0; to: 0 -0.015 0; dur: 2000; easing: easeInOutSine; loop: true; dir: alternate"></a-cylinder>

    <!-- Çatal (Fork) -->
    <a-cylinder position="-0.35 -0.28 0" radius="0.005" height="0.22" color="#ffb300" opacity="0.7" material="transparent:true; emissive:#ffb300; emissiveIntensity:0.3" rotation="0 0 15"></a-cylinder>
    <!-- Bıçak (Knife) -->
    <a-cylinder position="0.35 -0.28 0" radius="0.005" height="0.22" color="#c9a84c" opacity="0.7" material="transparent:true; emissive:#c9a84c; emissiveIntensity:0.3" rotation="0 0 -15"></a-cylinder>

    <!-- Particles -->
    <a-sphere position="-0.22 -0.1 0.1" radius="0.005" color="#ffb300" opacity="0.7" material="transparent:true" animation="property: position; from:-0.22 -0.38 0.1; to:-0.22 0.12 0.1; dur:3000; easing:easeInOutSine; loop:true; dir:alternate"></a-sphere>
    <a-sphere position="0.18 -0.05 -0.1" radius="0.004" color="#c9a84c" opacity="0.6" material="transparent:true" animation="property: position; from:0.18 -0.38 -0.1; to:0.18 0.1 -0.1; dur:4000; easing:easeInOutSine; loop:true; dir:alternate; delay:500"></a-sphere>
    <a-sphere position="0.08 0.05 0.18" radius="0.004" color="#ffb300" opacity="0.5" material="transparent:true" animation="property: position; from:0.08 -0.38 0.18; to:0.08 0.18 0.18; dur:2500; easing:easeInOutSine; loop:true; dir:alternate; delay:1000"></a-sphere>
    <a-sphere position="-0.3 0 0.04" radius="0.004" color="#00d4ff" opacity="0.4" material="transparent:true" animation="property: position; from:-0.3 -0.38 0.04; to:-0.3 0.08 0.04; dur:3500; easing:easeInOutSine; loop:true; dir:alternate; delay:1500"></a-sphere>
    <a-sphere position="0.28 0.05 0.08" radius="0.003" color="#c9a84c" opacity="0.5" material="transparent:true" animation="property: position; from:0.28 -0.38 0.08; to:0.28 0.14 0.08; dur:2800; easing:easeInOutSine; loop:true; dir:alternate; delay:800"></a-sphere>

    <!-- Başlık -->
    <a-text value="DEUTSCHE KUCHE" align="center" position="0 0.28 0" scale="0.28 0.28 0.28" color="#ffb300" material="emissive:#ffb300; emissiveIntensity:0.5" animation="property: position; from: 0 0.26 0; to: 0 0.30 0; dur: 2500; easing: easeInOutSine; loop: true; dir: alternate"></a-text>
    <a-text value="Berlin - Munchen - Stuttgart" align="center" position="0 0.21 0" scale="0.10 0.10 0.10" color="rgba(201,168,76,0.7)"></a-text>

    <!-- 5 Hotspot -->
    <!-- 1: Brezel — merkez, amber -->
    <a-sphere class="hotspot" position="0 0.07 0.01" radius="0.026" color="#ffb300" material="emissive:#ffb300; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.4 1.4 1.4; dur:1000; easing:easeInOutSine; loop:true; dir:alternate" data-person="brezel"></a-sphere>
    <a-torus position="0 0.07 0.01" radius="0.042" radius-tubular="0.003" color="#ffb300" opacity="0.35" animation="property: scale; from:1 1 1; to:2 2 2; dur:1500; easing:easeOutQuad; loop:true"></a-torus>
    <a-text value="[ BREZEL ]" align="center" position="0 0.155 0.01" scale="0.07 0.07 0.07" color="#ffb300"></a-text>

    <!-- 2: Bratwurst — sağ üst, gold -->
    <a-sphere class="hotspot" position="0.44 0.12 -0.05" radius="0.023" color="#c9a84c" material="emissive:#c9a84c; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.5 1.5 1.5; dur:800; easing:easeInOutSine; loop:true; dir:alternate; delay:300" data-person="bratwurst"></a-sphere>
    <a-text value="[ BRATWURST ]" align="center" position="0.44 0.19 -0.05" scale="0.07 0.07 0.07" color="#c9a84c"></a-text>

    <!-- 3: Berliner — sol üst, kırmızı -->
    <a-sphere class="hotspot" position="-0.44 0.12 -0.04" radius="0.023" color="#ff6b6b" material="emissive:#ff6b6b; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.4 1.4 1.4; dur:1200; easing:easeInOutSine; loop:true; dir:alternate; delay:600" data-person="berliner"></a-sphere>
    <a-text value="[ BERLINER ]" align="center" position="-0.44 0.19 -0.04" scale="0.07 0.07 0.07" color="#ff6b6b"></a-text>

    <!-- 4: Schwarzwälder Kirschtorte — sol alt, mor -->
    <a-sphere class="hotspot" position="-0.44 -0.14 0" radius="0.023" color="#aa88ff" material="emissive:#aa88ff; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.4 1.4 1.4; dur:900; easing:easeInOutSine; loop:true; dir:alternate; delay:900" data-person="kirschtorte"></a-sphere>
    <a-text value="[ KIRSCHTORTE ]" align="center" position="-0.44 -0.07 0" scale="0.07 0.07 0.07" color="#aa88ff"></a-text>

    <!-- 5: Currywurst — sağ alt, yeşil -->
    <a-sphere class="hotspot" position="0.44 -0.14 0.05" radius="0.023" color="#00ff88" material="emissive:#00ff88; emissiveIntensity:0.9; transparent:true; opacity:0.95" animation="property: scale; from:1 1 1; to:1.5 1.5 1.5; dur:1100; easing:easeInOutSine; loop:true; dir:alternate; delay:1200" data-person="currywurst"></a-sphere>
    <a-text value="[ CURRYWURST ]" align="center" position="0.44 -0.07 0.05" scale="0.07 0.07 0.07" color="#00ff88"></a-text>

  </a-entity>
</a-scene>

<div id="ui">
  <div class="c c-tl"></div><div class="c c-tr"></div><div class="c c-bl"></div><div class="c c-br"></div>
  <div class="scan"></div>
  <div id="tap-hint"></div>
  <div id="status">
    <div class="status-bar"><div class="status-bar-fill"></div></div>
    <span id="status-text"></span>
  </div>
  <button id="back" onclick="window.location.href='index.html'"></button>
  <div id="info-card">
    <button class="ic-close" onclick="closeCard()">&#x2715;</button>
    <div class="ic-tag" id="ic-tag"></div>
    <div class="ic-title" id="ic-title"></div>
    <div class="ic-sub" id="ic-sub"></div>
    <div class="ic-text" id="ic-text"></div>
  </div>
</div>

<script>
  var lang = localStorage.getItem('lang') || 'tr';

  var foods = {
    brezel: {
      tr: { tag:'İkonik Fırın Ürünü', title:'Brezel', sub:'Bavyera · Geleneksel Simidi', text:"Pretzel olarak da bilinen Brezel, dışı çıtır içi yumuşak geleneksel Alman fırın ürünüdür. Soda banyosundan geçirilerek pişirilen bu ekmek, Almanya'da kahvaltıdan bira bahçelerine kadar her yerde bulunur. Ökonomisi basit, lezzeti efsanedir." },
      de: { tag:'Traditionelles Gebäck', title:'Brezel', sub:'Bayern · Traditionelle Laugenbrezel', text:'Die Brezel ist ein außen knuspriges, innen weiches traditionelles deutsches Gebäck. Durch ein Sodabad vor dem Backen erhält sie ihre charakteristische braune Farbe und ihren unverwechselbaren Geschmack. Von der Bäckerei bis zum Biergarten — die Brezel ist allgegenwärtig.' }
    },
    bratwurst: {
      tr: { tag:'Sokak Lezzeti', title:'Bratwurst', sub:'Tüm Almanya · Izgara Sosis', text:"Bratwurst, Almanya'nın en ünlü sokak yemeğidir. Domuz, dana veya kuzu etinden yapılan bu ızgara sosis hardal ve ekmekle servis edilir. Her bölgenin kendi tarifi vardır: Nürnberg Bratwurstları küçük ve baharatlı, Thüringen versiyonu ise uzun ve sarımsaklıdır." },
      de: { tag:'Streetfood Klassiker', title:'Bratwurst', sub:'Ganz Deutschland · Grillwurst', text:'Die Bratwurst ist Deutschlands bekanntestes Streetfood. Die aus Schweine-, Rind- oder Lammfleisch hergestellte Grillwurst wird mit Senf und Brötchen serviert. Jede Region hat ihr eigenes Rezept: Nürnberger sind klein und würzig, Thüringer lang und knoblauchbetont.' }
    },
    berliner: {
      tr: { tag:"Berlin'in Tatlısı", title:'Berliner', sub:'Berlin · Pfannkuchen', text:"Berliner, içi marmelat veya muhallebi dolu, pudra şekerli kızartılmış bir hamur tatlısıdır. Berlin'de 'Pfannkuchen' olarak bilinir. Yılbaşı ve Karnaval dönemlerinde tüketimi zirveye ulaşır. John F. Kennedy'nin ünlü 'Ich bin ein Berliner' konuşmasıyla da tarihe geçmiştir." },
      de: { tag:'Berliner Pfannkuchen', title:'Berliner', sub:'Berlin · Gefüllter Krapfen', text:"Der Berliner ist ein frittiertes Hefegebäck, gefüllt mit Marmelade oder Pudding, bestreut mit Puderschucker. In Berlin selbst heißt er 'Pfannkuchen'. Besonders zu Silvester und Karneval ist er sehr beliebt. John F. Kennedy machte ihn mit 'Ich bin ein Berliner' weltberühmt." }
    },
    kirschtorte: {
      tr: { tag:'Kara Orman Pastası', title:'Schwarzwälder Kirschtorte', sub:'Baden-Württemberg · Özel Pasta', text:"Schwarzwälder Kirschtorte, çikolatalı bisküvi, taze krema ve vişneli kiraz likörü (Kirschwasser) katmanlarından oluşan Almanya'nın en ünlü pastasıdır. 1900'lerin başında ortaya çıkan bu tarif, bugün dünya çapında ünlüdür. Bir dilimi Almanya'nın tüm lezzetini taşır." },
      de: { tag:'Schwarzwälder Spezialität', title:'Schwarzwälder Kirschtorte', sub:'Baden-Württemberg · Sahnetorte', text:"Die Schwarzwälder Kirschtorte ist Deutschlands bekannteste Torte, bestehend aus Schokoladenbiskuit, frischer Sahne und Kirschen mit Kirschwasser. In den frühen 1900er Jahren entstanden, ist dieses Rezept heute weltberühmt. Ein Stück trägt den ganzen Geschmack Deutschlands in sich." }
    },
    currywurst: {
      tr: { tag:"Berlin Klasiği", title:'Currywurst', sub:'Berlin · 1949\'dan Beri', text:"Currywurst, 1949'da Berlin'de Herta Heuwer tarafından icat edilen domates soslu ve köri baharatlı bir sosisle hazırlanan yemektir. Yıllık 800 milyondan fazla tüketiliyor. Çıtır patates kızartmasıyla (Pommes) servis edilir. Berlin'in Currywurst Müzesi bu lezzete adanmıştır." },
      de: { tag:'Berliner Kultgericht', title:'Currywurst', sub:'Berlin · Seit 1949', text:"Die Currywurst wurde 1949 in Berlin von Herta Heuwer erfunden: eine Bratwurst mit Tomatensauce und Currypulver. Über 800 Millionen werden jährlich verzehrt. Sie wird mit Pommes frites serviert. Das Currywurst-Museum Berlin ist diesem Berliner Kultgericht gewidmet." }
    }
  };

  var uiTexts = {
    tr: { status:'Taraniyor...', found:'\u2713 Hedef Bulundu \u2014 Noktalara Dokun', hint:'\u25B2 Noktalara Dokun', back:'\u2190 Geri Don' },
    de: { status:'Wird gescannt...', found:'\u2713 Ziel erkannt \u2014 Punkte antippen', hint:'\u25B2 Punkte antippen', back:'\u2190 Zur\u00fcck' }
  };

  var statusEl = document.getElementById('status');
  var statusText = document.getElementById('status-text');
  var tapHint = document.getElementById('tap-hint');
  var backBtn = document.getElementById('back');
  var card = document.getElementById('info-card');

  statusText.textContent = uiTexts[lang].status;
  tapHint.textContent = uiTexts[lang].hint;
  backBtn.textContent = uiTexts[lang].back;

  var target = document.querySelector('[mindar-image-target]');
  target.addEventListener('targetFound', function() {
    statusText.textContent = uiTexts[lang].found;
    statusEl.classList.add('found');
    tapHint.style.display = 'block';
  });
  target.addEventListener('targetLost', function() {
    statusText.textContent = uiTexts[lang].status;
    statusEl.classList.remove('found');
    tapHint.style.display = 'none';
    closeCard();
  });

  document.querySelectorAll('.hotspot').forEach(function(hs) {
    hs.addEventListener('click', function() {
      var key = hs.getAttribute('data-person');
      if (!key || !foods[key]) return;
      var data = foods[key][lang];
      document.getElementById('ic-tag').textContent = data.tag;
      document.getElementById('ic-title').textContent = data.title;
      document.getElementById('ic-sub').textContent = data.sub;
      document.getElementById('ic-text').textContent = data.text;
      card.classList.add('show');
    });
  });

  function closeCard() { card.classList.remove('show'); }
</script>
</body>
</html>
