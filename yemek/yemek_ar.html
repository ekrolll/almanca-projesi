<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Deutsche Küche AR — Deutschland Entdecken</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Arial', sans-serif; }
    a-scene { width: 100vw !important; height: 100vh !important; position: fixed !important; top: 0 !important; left: 0 !important; }

    #ui { position: fixed; inset: 0; pointer-events: none; z-index: 1000; }

    #status {
      position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.80); color: #e8d5b0; font-size: .62rem;
      letter-spacing: .25em; text-transform: uppercase; padding: .5rem 1.2rem;
      border: 1px solid rgba(200,170,110,.3); backdrop-filter: blur(12px);
      white-space: nowrap; animation: blink 2.5s ease infinite;
      display: flex; align-items: center; gap: 0.5rem;
    }
    #status.found { color: #a8c87a; border-color: rgba(150,200,100,.4); animation: none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.45} }

    .status-bar { width: 36px; height: 2px; background: rgba(200,170,110,0.18); position: relative; overflow: hidden; border-radius: 2px; }
    .status-bar-fill { position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: #c9a84c; animation: barSlide 2s linear infinite; }
    #status.found .status-bar-fill { background: #a8c87a; animation: none; width: 100%; left: 0; }
    @keyframes barSlide { 0%{left:-100%} 100%{left:100%} }

    #back {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,.80); color: #e8d5b0;
      border: 1px solid rgba(200,170,110,.3); padding: .45rem 1.2rem;
      font-size: .62rem; letter-spacing: .2em; text-transform: uppercase;
      cursor: pointer; pointer-events: all; backdrop-filter: blur(12px); font-family: Arial, sans-serif;
    }
    #tap-hint {
      position: absolute; top: 68px; left: 50%; transform: translateX(-50%);
      color: rgba(220,190,130,.6); font-size: .6rem; letter-spacing: .25em;
      text-transform: uppercase; display: none; animation: blink 2s ease infinite;
    }

    #info-card {
      position: absolute; bottom: 70px; left: 50%;
      transform: translateX(-50%) translateY(260px);
      width: min(360px, 92vw);
      background: rgba(12,8,3,.92); border: 1px solid rgba(200,165,100,.45);
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      padding: 1.2rem 1.5rem;
      transition: transform .4s cubic-bezier(.16,1,.3,1), opacity .4s ease;
      opacity: 0; pointer-events: none;
    }
    #info-card.show { transform: translateX(-50%) translateY(0); opacity: 1; pointer-events: all; }
    .ic-tag { font-size: .55rem; letter-spacing: .35em; text-transform: uppercase; color: #c9a84c; margin-bottom: .4rem; display: flex; align-items: center; gap: .5rem; }
    .ic-tag::after { content: ''; flex: 1; height: 1px; background: rgba(200,165,100,.22); }
    .ic-title { font-size: 1.25rem; font-weight: 700; color: #f0e8d5; margin-bottom: .25rem; }
    .ic-sub { font-size: .7rem; color: #b8944c; letter-spacing: .1em; margin-bottom: .65rem; }
    .ic-text { font-size: .8rem; color: rgba(240,232,210,.7); line-height: 1.65; }
    .ic-close { position: absolute; top: .6rem; right: .8rem; color: rgba(200,165,100,.5); cursor: pointer; font-size: .9rem; pointer-events: all; background: none; border: none; font-family: Arial; }
    .ic-close:hover { color: #c9a84c; }
  </style>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
  shadow="type: pcfsoft; enabled: true">

  <!-- Ortam ışığı — sıcak, zayıf -->
  <a-light type="ambient" color="#d0b080" intensity="0.55"></a-light>
  <!-- Ana ışık — sağ üstten soft -->
  <a-light type="directional" color="#fff5e0" intensity="1.1"
    position="0.8 1.8 1.2" cast-shadow="true"
    shadow-camera-near="0.1" shadow-camera-far="10"
    shadow-camera-left="-1" shadow-camera-right="1"
    shadow-camera-top="1" shadow-camera-bottom="-1"
    shadow-map-width="2048" shadow-map-height="2048">
  </a-light>
  <!-- Dolgu ışığı — soldan serin -->
  <a-light type="directional" color="#a0c0e8" intensity="0.28" position="-1 0.8 0.6"></a-light>

  <a-camera position="0 0 0" look-controls="enabled: false"
    cursor="fuse: false; rayOrigin: mouse"
    raycaster="objects: .hotspot; far: 100">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- ═══════════════════════════════════════════════════════
         MASA YÜZEYİ — koyu meşe ahşap
    ════════════════════════════════════════════════════════ -->
    <a-cylinder position="0 -0.395 0" radius="0.62" height="0.010"
      color="#1c0f07"
      material="roughness:0.98; metalness:0; repeat:4 4"
      shadow="receive: true">
    </a-cylinder>
    <!-- Masa kenar çizgisi (ince halkı) -->
    <a-torus position="0 -0.390 0" radius="0.618" radius-tubular="0.004"
      color="#0e0805" material="roughness:1; metalness:0">
    </a-torus>

    <!-- ═══════════════════════════════════════════════════════
         TABAK — beyaz porselen, mat, gerçekçi rim
    ════════════════════════════════════════════════════════ -->
    <!-- Alt gölge yansıması -->
    <a-cylinder position="0 -0.393 0" radius="0.29" height="0.001"
      color="#000000" material="transparent:true; opacity:0.28">
    </a-cylinder>

    <!-- Tabak gövdesi -->
    <a-cylinder position="0 -0.338 0" radius="0.270" height="0.018"
      color="#F6F2EC"
      material="roughness:0.88; metalness:0; envMap: none"
      shadow="cast:true; receive:true">
    </a-cylinder>
    <!-- İç çukur (tabağın iç düzlemi) -->
    <a-cylinder position="0 -0.329 0" radius="0.210" height="0.004"
      color="#FDFAF5"
      material="roughness:0.82; metalness:0">
    </a-cylinder>
    <!-- Dış rim halka -->
    <a-torus position="0 -0.330 0" radius="0.255" radius-tubular="0.015"
      color="#E8E0D0"
      material="roughness:0.90; metalness:0">
    </a-torus>
    <!-- İkinci ince rim çizgisi -->
    <a-torus position="0 -0.330 0" radius="0.216" radius-tubular="0.004"
      color="#D8CFBF"
      material="roughness:0.85; metalness:0">
    </a-torus>

    <!-- ═══════════════════════════════════════════════════════
         ÇATAL — sol, 3 diş, gümüş paslanmaz çelik
    ════════════════════════════════════════════════════════ -->
    <a-entity position="-0.36 -0.30 0.01" rotation="0 0 8">
      <!-- Sap uzun kısmı -->
      <a-cylinder position="0 -0.048 0" radius="0.0058" height="0.155"
        color="#C0C0C0" material="roughness:0.18; metalness:0.92; color:#C8C8C8">
      </a-cylinder>
      <!-- Sap üst genişleme -->
      <a-cylinder position="0 0.035 0" radius="0.007" height="0.022"
        color="#BEBEBE" material="roughness:0.22; metalness:0.88">
      </a-cylinder>
      <!-- 3 diş -->
      <a-cylinder position="-0.0085 0.072 0" radius="0.0022" height="0.052"
        color="#D4D4D4" material="roughness:0.14; metalness:0.95">
      </a-cylinder>
      <a-cylinder position="0 0.072 0" radius="0.0022" height="0.052"
        color="#D4D4D4" material="roughness:0.14; metalness:0.95">
      </a-cylinder>
      <a-cylinder position="0.0085 0.072 0" radius="0.0022" height="0.052"
        color="#D4D4D4" material="roughness:0.14; metalness:0.95">
      </a-cylinder>
      <!-- Diş üst yuvarlaması -->
      <a-sphere position="-0.0085 0.097 0" radius="0.0025" color="#D0D0D0" material="roughness:0.14; metalness:0.95"></a-sphere>
      <a-sphere position="0 0.097 0" radius="0.0025" color="#D0D0D0" material="roughness:0.14; metalness:0.95"></a-sphere>
      <a-sphere position="0.0085 0.097 0" radius="0.0025" color="#D0D0D0" material="roughness:0.14; metalness:0.95"></a-sphere>
    </a-entity>

    <!-- ═══════════════════════════════════════════════════════
         BIÇAK — sağ, gümüş paslanmaz + bıçak ağzı
    ════════════════════════════════════════════════════════ -->
    <a-entity position="0.36 -0.30 0.01" rotation="0 0 -8">
      <!-- Sap -->
      <a-cylinder position="0 -0.048 0" radius="0.0058" height="0.155"
        color="#C0C0C0" material="roughness:0.18; metalness:0.92">
      </a-cylinder>
      <!-- Sap üst koruyucu (bolster) -->
      <a-cylinder position="0 0.035 0" radius="0.0082" height="0.016"
        color="#A8A8A8" material="roughness:0.25; metalness:0.90">
      </a-cylinder>
      <!-- Bıçak ağzı (flat box) -->
      <a-box position="0.001 0.072 0" width="0.012" height="0.056" depth="0.0028"
        color="#D8D8D8" material="roughness:0.10; metalness:0.96">
      </a-box>
      <!-- Ağız sırtı biraz daha kalın -->
      <a-box position="-0.002 0.072 0" width="0.003" height="0.056" depth="0.0028"
        color="#C4C4C4" material="roughness:0.12; metalness:0.94">
      </a-box>
      <!-- Uç yuvarlaması -->
      <a-sphere position="0.001 0.099 0" radius="0.004" color="#D0D0D0" material="roughness:0.12; metalness:0.95"></a-sphere>
    </a-entity>

    <!-- ═══════════════════════════════════════════════════════
         BERLİNER — tabak ortasında, yavaş nefes animasyonu
    ════════════════════════════════════════════════════════ -->
    <a-entity position="0 -0.290 0"
      animation="property: position; from: 0 -0.290 0; to: 0 -0.274 0; dur: 2600; easing: easeInOutSine; loop: true; dir: alternate">

      <!-- Berliner gövdesi — yassılaştırılmış altın-kahve küre -->
      <a-sphere class="hotspot" data-person="berliner"
        radius="0.078" color="#C8873A"
        material="roughness:0.88; metalness:0"
        scale="1 0.64 1"
        shadow="cast:true; receive:true">
      </a-sphere>

      <!-- Pudra şekeri —  beyaz ince cylinder üstte -->
      <a-cylinder position="0 0.022 0" radius="0.073" height="0.003"
        color="#FAFAFA" material="roughness:0.95; metalness:0; transparent:true; opacity:0.82"
        scale="1 1 1">
      </a-cylinder>

      <!-- Marmelat çizgisi (orta kuşak) -->
      <a-torus position="0 0 0" radius="0.073" radius-tubular="0.0055"
        color="#B03020" material="roughness:0.75; metalness:0"
        rotation="90 0 0">
      </a-torus>

      <!-- Berliner label — sade, mat sarı -->
      <a-text value="BERLINER" align="center" position="0 0.145 0"
        scale="0.070 0.070 0.070" color="#c9a84c"
        material="depthTest:false">
      </a-text>
      <a-text value="Berliner Pfannkuchen" align="center" position="0 0.117 0"
        scale="0.040 0.040 0.040" color="rgba(200,165,100,0.65)"
        material="depthTest:false">
      </a-text>

      <!-- Gölge altında -->
      <a-cylinder position="0 -0.052 0" radius="0.068" height="0.001"
        color="#000000" material="transparent:true; opacity:0.22">
      </a-cylinder>
    </a-entity>

    <!-- ═══════════════════════════════════════════════════════
         BREZEL — tabağın sağ üstünde, yavaş dönüyor
    ════════════════════════════════════════════════════════ -->
    <a-entity position="0.26 -0.315 -0.06"
      animation="property: position; from: 0.26 -0.315 -0.06; to: 0.26 -0.300 -0.06; dur: 2800; easing: easeInOutSine; loop: true; dir: alternate; delay: 400">

      <a-torus class="hotspot" data-person="brezel"
        radius="0.058" radius-tubular="0.022"
        color="#7A3A0E"
        material="roughness:0.92; metalness:0"
        animation="property: rotation; from: 15 0 0; to: 15 360 0; dur: 9000; easing: linear; loop: true"
        shadow="cast:true; receive:true">
      </a-torus>
      <!-- Tuz taneleri taklidi (beyaz nokta) -->
      <a-sphere position="0 0.008 0.058" radius="0.004" color="#F5F0E8" material="roughness:0.95; metalness:0"></a-sphere>
      <a-sphere position="-0.04 0.008 0.042" radius="0.003" color="#F5F0E8" material="roughness:0.95; metalness:0"></a-sphere>
      <a-sphere position="0.04 0.008 0.042" radius="0.003" color="#F5F0E8" material="roughness:0.95; metalness:0"></a-sphere>

      <a-text value="BREZEL" align="center" position="0 0.11 0"
        scale="0.058 0.058 0.058" color="#c9a84c" material="depthTest:false">
      </a-text>

      <a-cylinder position="0 -0.042 0" radius="0.050" height="0.001"
        color="#000000" material="transparent:true; opacity:0.18">
      </a-cylinder>
    </a-entity>

    <!-- ═══════════════════════════════════════════════════════
         BRATWURST — tabağın solunda, yatay ızgara sosis
    ════════════════════════════════════════════════════════ -->
    <a-entity position="-0.26 -0.320 -0.06"
      animation="property: position; from: -0.26 -0.320 -0.06; to: -0.26 -0.305 -0.06; dur: 2400; easing: easeInOutSine; loop: true; dir: alternate; delay: 800">

      <!-- Ana sosis gövdesi -->
      <a-cylinder class="hotspot" data-person="bratwurst"
        radius="0.022" height="0.150"
        color="#A0520A"
        material="roughness:0.85; metalness:0"
        rotation="0 30 90"
        shadow="cast:true; receive:true">
      </a-cylinder>
      <!-- Uç kapakları -->
      <a-sphere position="-0.073 0 0" radius="0.022" color="#8A4208" material="roughness:0.88; metalness:0" scale="0.6 1 1"></a-sphere>
      <a-sphere position="0.073 0 0" radius="0.022" color="#8A4208" material="roughness:0.88; metalness:0" scale="0.6 1 1"></a-sphere>
      <!-- Izgara çizgileri (koyu band) -->
      <a-cylinder radius="0.0235" height="0.010" color="#5A2A04" material="roughness:0.9; metalness:0" rotation="0 30 90" position="0.018 0.008 0"></a-cylinder>
      <a-cylinder radius="0.0235" height="0.010" color="#5A2A04" material="roughness:0.9; metalness:0" rotation="0 30 90" position="-0.018 -0.008 0"></a-cylinder>

      <a-text value="BRATWURST" align="center" position="0 0.095 0"
        scale="0.052 0.052 0.052" color="#c9a84c" material="depthTest:false">
      </a-text>

      <a-cylinder position="0 -0.032 0" radius="0.055" height="0.001"
        color="#000000" material="transparent:true; opacity:0.16">
      </a-cylinder>
    </a-entity>

    <!-- ═══════════════════════════════════════════════════════
         CURRYWURST — tabak dışı sol arka
    ════════════════════════════════════════════════════════ -->
    <a-entity position="-0.18 -0.310 -0.20"
      animation="property: position; from: -0.18 -0.310 -0.20; to: -0.18 -0.295 -0.20; dur: 2200; easing: easeInOutSine; loop: true; dir: alternate; delay: 1200">

      <a-cylinder class="hotspot" data-person="currywurst"
        radius="0.020" height="0.130"
        color="#B83A00"
        material="roughness:0.83; metalness:0"
        rotation="0 -20 90"
        shadow="cast:true; receive:true">
      </a-cylinder>
      <!-- Köri sosu üst sarısı -->
      <a-cylinder radius="0.021" height="0.050" color="#D4790A"
        material="roughness:0.78; metalness:0; transparent:true; opacity:0.9"
        rotation="0 -20 90" position="0.010 0.005 0">
      </a-cylinder>

      <a-text value="CURRYWURST" align="center" position="0 0.085 0"
        scale="0.046 0.046 0.046" color="#c9a84c" material="depthTest:false">
      </a-text>

      <a-cylinder position="0 -0.030 0" radius="0.050" height="0.001"
        color="#000000" material="transparent:true; opacity:0.14">
      </a-cylinder>
    </a-entity>

    <!-- ═══════════════════════════════════════════════════════
         KİRSCHTORTE — sağ arka
    ════════════════════════════════════════════════════════ -->
    <a-entity position="0.19 -0.308 -0.20"
      animation="property: position; from: 0.19 -0.308 -0.20; to: 0.19 -0.292 -0.20; dur: 2350; easing: easeInOutSine; loop: true; dir: alternate; delay: 600">

      <!-- Pasta gövdesi çikolatalı katman -->
      <a-cylinder class="hotspot" data-person="kirschtorte"
        radius="0.052" height="0.048"
        color="#2A0A0A"
        material="roughness:0.92; metalness:0"
        shadow="cast:true; receive:true">
      </a-cylinder>
      <!-- Beyaz krema üstü -->
      <a-cylinder position="0 0.028 0" radius="0.052" height="0.010"
        color="#F8F4F0" material="roughness:0.75; metalness:0">
      </a-cylinder>
      <!-- Kiraz -->
      <a-sphere position="0 0.042 0" radius="0.012"
        color="#7A0000" material="roughness:0.62; metalness:0.05">
      </a-sphere>
      <!-- Kiraz sap -->
      <a-cylinder position="0.002 0.054 0" radius="0.0015" height="0.010"
        color="#2A5A10" material="roughness:0.9; metalness:0" rotation="0 0 15">
      </a-cylinder>

      <a-text value="KIRSCHTORTE" align="center" position="0 0.110 0"
        scale="0.044 0.044 0.044" color="#c9a84c" material="depthTest:false">
      </a-text>

      <a-cylinder position="0 -0.038 0" radius="0.045" height="0.001"
        color="#000000" material="transparent:true; opacity:0.18">
      </a-cylinder>
    </a-entity>

  </a-entity>
</a-scene>

<div id="ui">
  <div id="tap-hint"></div>
  <div id="status">
    <div class="status-bar"><div class="status-bar-fill"></div></div>
    <span id="status-text"></span>
  </div>
  <button id="back" onclick="window.location.href='index.html'"></button>
  <div id="info-card">
    <button class="ic-close" onclick="closeCard()">&#x2715;</button>
    <div class="ic-tag" id="ic-tag"></div>
    <div class="ic-title" id="ic-title"></div>
    <div class="ic-sub" id="ic-sub"></div>
    <div class="ic-text" id="ic-text"></div>
  </div>
</div>

<script>
  var lang = localStorage.getItem('lang') || 'tr';

  var foods = {
    berliner: {
      tr: { tag:"Berlin'in Tatlısı", title:'Berliner', sub:'Berlin · Pfannkuchen', text:"Berliner, içi marmelat veya muhallebi dolu, pudra şekerli kızartılmış bir hamur tatlısıdır. Berlin'de 'Pfannkuchen' olarak bilinir. Yılbaşı ve Karnaval dönemlerinde tüketimi zirveye ulaşır. John F. Kennedy'nin ünlü 'Ich bin ein Berliner' konuşmasıyla da tarihe geçmiştir." },
      de: { tag:'Berliner Pfannkuchen', title:'Berliner', sub:'Berlin · Gefüllter Krapfen', text:"Der Berliner ist ein frittiertes Hefegebäck, gefüllt mit Marmelade oder Pudding, bestreut mit Puderzucker. In Berlin selbst heißt er 'Pfannkuchen'. Besonders zu Silvester und Karneval ist er sehr beliebt. John F. Kennedy machte ihn mit 'Ich bin ein Berliner' weltberühmt." }
    },
    brezel: {
      tr: { tag:'İkonik Fırın Ürünü', title:'Brezel', sub:'Bavyera · Geleneksel Simidi', text:"Pretzel olarak da bilinen Brezel, dışı çıtır içi yumuşak geleneksel Alman fırın ürünüdür. Soda banyosundan geçirilerek pişirilen bu ekmek, Almanya'da kahvaltıdan bira bahçelerine kadar her yerde bulunur." },
      de: { tag:'Traditionelles Gebäck', title:'Brezel', sub:'Bayern · Traditionelle Laugenbrezel', text:'Die Brezel ist ein außen knuspriges, innen weiches traditionelles deutsches Gebäck. Durch ein Sodabad vor dem Backen erhält sie ihre charakteristische braune Farbe und ihren unverwechselbaren Geschmack.' }
    },
    bratwurst: {
      tr: { tag:'Sokak Lezzeti', title:'Bratwurst', sub:'Tüm Almanya · Izgara Sosis', text:"Bratwurst, Almanya'nın en ünlü sokak yemeğidir. Domuz, dana veya kuzu etinden yapılan bu ızgara sosis hardal ve ekmekle servis edilir. Her bölgenin kendi tarifi vardır." },
      de: { tag:'Streetfood Klassiker', title:'Bratwurst', sub:'Ganz Deutschland · Grillwurst', text:'Die Bratwurst ist Deutschlands bekanntestes Streetfood. Die aus Schweine-, Rind- oder Lammfleisch hergestellte Grillwurst wird mit Senf und Brötchen serviert.' }
    },
    currywurst: {
      tr: { tag:"Berlin Klasiği", title:'Currywurst', sub:"Berlin · 1949'dan Beri", text:"Currywurst, 1949'da Berlin'de Herta Heuwer tarafından icat edilen domates soslu ve köri baharatlı bir sosisle hazırlanan yemektir. Yıllık 800 milyondan fazla tüketiliyor." },
      de: { tag:'Berliner Kultgericht', title:'Currywurst', sub:'Berlin · Seit 1949', text:"Die Currywurst wurde 1949 in Berlin von Herta Heuwer erfunden: eine Bratwurst mit Tomatensauce und Currypulver. Über 800 Millionen werden jährlich verzehrt." }
    },
    kirschtorte: {
      tr: { tag:'Kara Orman Pastası', title:'Schwarzwälder Kirschtorte', sub:'Baden-Württemberg · Özel Pasta', text:"Schwarzwälder Kirschtorte, çikolatalı bisküvi, taze krema ve vişneli kiraz likörü katmanlarından oluşan Almanya'nın en ünlü pastasıdır. 1900'lerin başında ortaya çıkan bu tarif bugün dünya çapında ünlüdür." },
      de: { tag:'Schwarzwälder Spezialität', title:'Schwarzwälder Kirschtorte', sub:'Baden-Württemberg · Sahnetorte', text:"Die Schwarzwälder Kirschtorte ist Deutschlands bekannteste Torte, bestehend aus Schokoladenbiskuit, frischer Sahne und Kirschen mit Kirschwasser." }
    }
  };

  var uiTexts = {
    tr: { status:'Taraniyor...', found:'\u2713 Hedef Bulundu \u2014 Dokun', hint:'\u25B2 Yiyeceklere Dokun', back:'\u2190 Geri D\u00f6n' },
    de: { status:'Wird gescannt...', found:'\u2713 Ziel erkannt \u2014 Antippen', hint:'\u25B2 Speisen antippen', back:'\u2190 Zur\u00fcck' }
  };

  var statusEl   = document.getElementById('status');
  var statusText = document.getElementById('status-text');
  var tapHint    = document.getElementById('tap-hint');
  var backBtn    = document.getElementById('back');
  var card       = document.getElementById('info-card');

  statusText.textContent = uiTexts[lang].status;
  tapHint.textContent    = uiTexts[lang].hint;
  backBtn.textContent    = uiTexts[lang].back;

  var target = document.querySelector('[mindar-image-target]');
  target.addEventListener('targetFound', function() {
    statusText.textContent = uiTexts[lang].found;
    statusEl.classList.add('found');
    tapHint.style.display = 'block';
  });
  target.addEventListener('targetLost', function() {
    statusText.textContent = uiTexts[lang].status;
    statusEl.classList.remove('found');
    tapHint.style.display = 'none';
    closeCard();
  });

  document.querySelectorAll('.hotspot').forEach(function(hs) {
    hs.addEventListener('click', function() {
      var key = hs.getAttribute('data-person');
      if (!key || !foods[key]) return;
      var data = foods[key][lang];
      document.getElementById('ic-tag').textContent   = data.tag;
      document.getElementById('ic-title').textContent = data.title;
      document.getElementById('ic-sub').textContent   = data.sub;
      document.getElementById('ic-text').textContent  = data.text;
      card.classList.add('show');
    });
  });

  function closeCard() { card.classList.remove('show'); }
</script>
</body>
</html>
