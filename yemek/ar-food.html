<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR: Deutsche Küche</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <style>
        :root { --amber: #ffb300; --cyan: #00d4ff; --dark: rgba(2, 10, 18, 0.85); }
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        #hud { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 10; }
        .bracket { position: absolute; width: 40px; height: 40px; border: 3px solid var(--amber); box-shadow: 0 0 10px var(--amber); }
        .top-left { top: 5%; left: 5%; border-right: none; border-bottom: none; }
        .top-right { top: 5%; right: 5%; border-left: none; border-bottom: none; }
        .bottom-left { bottom: 5%; left: 5%; border-right: none; border-top: none; }
        .bottom-right { bottom: 5%; right: 5%; border-left: none; border-top: none; }
        .v-scanline { position: absolute; top: 0; left: 0; width: 2px; height: 100%; background: var(--amber); box-shadow: 0 0 15px 5px rgba(255, 179, 0, 0.5); animation: scanHorizontal 3s linear infinite; }
        @keyframes scanHorizontal { 0% { left: 0; opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { left: 100%; opacity: 0; } }
        #status-bar { position: absolute; bottom: 8%; left: 50%; transform: translateX(-50%); color: var(--amber); font-weight: bold; font-family: monospace; text-shadow: 0 0 5px var(--amber); letter-spacing: 2px; }
        /* Dönüş butonu index.html'e yönlendirildi */
        #back-btn { position: absolute; top: 20px; left: 20px; z-index: 20; padding: 10px 20px; background: rgba(0,0,0,0.5); border: 1px solid var(--amber); color: var(--amber); cursor: pointer; pointer-events: auto; text-transform: uppercase; }
        #side-panel { position: absolute; top: 0; right: 0; width: 320px; height: 100vh; background: var(--dark); backdrop-filter: blur(15px); border-left: 2px solid var(--cyan); box-shadow: -5px 0 20px rgba(0, 212, 255, 0.3); color: white; padding: 2rem; z-index: 30; transform: translateX(100%); transition: transform 0.4s cubic-bezier(0.25, 0.8, 0.25, 1); display: flex; flex-direction: column; justify-content: center; pointer-events: auto; }
        #side-panel.open { transform: translateX(0); }
        .panel-close { position: absolute; top: 20px; right: 20px; background: none; border: none; color: var(--cyan); font-size: 2rem; cursor: pointer; }
        #info-title { color: var(--amber); font-size: 2rem; text-shadow: 0 0 10px var(--amber); margin-bottom: 0.5rem; }
        #info-sub { color: var(--cyan); font-style: italic; margin-bottom: 1.5rem; }
        #info-desc { line-height: 1.6; font-size: 1rem; color: #ddd; }
    </style>
</head>
<body>
    <div id="hud">
        <div class="bracket top-left"></div><div class="bracket top-right"></div>
        <div class="bracket bottom-left"></div><div class="bracket bottom-right"></div>
        <div class="v-scanline"></div><div id="status-bar">SYSTEM SCANNING...</div>
    </div>
    
    <button id="back-btn" onclick="window.location.href='index.html'">[ X ] BACK</button>

    <div id="side-panel">
        <button class="panel-close" onclick="closePanel()">&times;</button>
        <h2 id="info-title">Title</h2>
        <div id="info-sub">Subtitle</div>
        <p id="info-desc">Description goes here.</p>
    </div>

    <a-scene mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: no;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
        
        <a-camera position="0 0 0" look-controls="enabled: false">
            <a-entity cursor="rayOrigin: mouse;" raycaster="objects: .clickable"></a-entity>
        </a-camera>

        <a-light type="ambient" color="#222"></a-light>
        <a-light type="directional" color="#ffffff" intensity="2" position="1 2 1"></a-light>

        <a-entity mindar-image-target="targetIndex: 0" id="target-entity">
            <a-entity position="0 -0.2 0">
                <a-entity position="-0.8 0 0">
                    <a-cylinder radius="0.35" height="0.02" color="#00d4ff" material="opacity: 0.3; transparent: true" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000"></a-cylinder>
                    <a-torus radius="0.15" tube="0.04" color="#ffb300" position="0 0.15 0" rotation="45 45 0"></a-torus>
                    <a-torus radius="0.15" tube="0.04" color="#ffb300" position="0 0.15 0" rotation="-45 -45 0"></a-torus>
                    <a-text value="[ BREZEL ]" color="#00d4ff" position="0 0.4 0" align="center" scale="0.5 0.5 0.5"></a-text>
                    <a-sphere class="clickable" radius="0.06" position="0 0.3 0" color="#00d4ff" material="emissive: #00d4ff; emissiveIntensity: 0.5" animation="property: scale; dir: alternate; dur: 1000; to: 1.2 1.2 1.2; loop: true" data-title="Brezel" data-sub="Der ikonische Knoten" data-desc="Das abstrakte Modell des bayerischen Brezels."></a-sphere>
                </a-entity>

                <a-entity position="0 0 0">
                    <a-cylinder radius="0.35" height="0.02" color="#00d4ff" material="opacity: 0.3; transparent: true" animation="property: rotation; to: 0 -360 0; loop: true; dur: 8000"></a-cylinder>
                    <a-cylinder radius="0.06" height="0.4" color="#c9a84c" position="0 0.1 0" rotation="0 0 90"></a-cylinder>
                    <a-text value="[ WURST ]" color="#00d4ff" position="0 0.4 0" align="center" scale="0.5 0.5 0.5"></a-text>
                    <a-sphere class="clickable" radius="0.06" position="0 0.3 0" color="#00d4ff" material="emissive: #00d4ff; emissiveIntensity: 0.5" animation="property: scale; dir: alternate; dur: 1000; to: 1.2 1.2 1.2; loop: true" data-title="Bratwurst" data-sub="Der Streetfood-Klassiker" data-desc="Zylindrische Darstellung der deutschen Wurstkultur."></a-sphere>
                </a-entity>

                <a-entity position="0.8 0 0">
                    <a-cylinder radius="0.35" height="0.02" color="#00d4ff" material="opacity: 0.3; transparent: true" animation="property: rotation; to: 0 360 0; loop: true; dur: 8000"></a-cylinder>
                    <a-cylinder radius="0.15" height="0.05" color="#3d2314" position="0 0.05 0"></a-cylinder>
                    <a-cylinder radius="0.15" height="0.03" color="#ffffff" position="0 0.09 0"></a-cylinder>
                    <a-cylinder radius="0.15" height="0.05" color="#3d2314" position="0 0.13 0"></a-cylinder>
                    <a-sphere radius="0.04" color="#ff0000" position="0 0.18 0"></a-sphere>
                    <a-text value="[ TORTE ]" color="#00d4ff" position="0 0.4 0" align="center" scale="0.5 0.5 0.5"></a-text>
                    <a-sphere class="clickable" radius="0.06" position="0 0.3 0" color="#00d4ff" material="emissive: #00d4ff; emissiveIntensity: 0.5" animation="property: scale; dir: alternate; dur: 1000; to: 1.2 1.2 1.2; loop: true" data-title="Kirschtorte" data-sub="Schwarzwälder Spezialität" data-desc="Holografische Interpretation der Schwarzwälder Kirschtorte."></a-sphere>
                </a-entity>
            </a-entity>
        </a-entity>
    </a-scene>

    <script>
        const targetEntity = document.querySelector('#target-entity');
        const statusBar = document.querySelector('#status-bar');
        targetEntity.addEventListener('targetFound', () => { statusBar.innerText = "TARGET ACQUIRED"; statusBar.style.color = "#00d4ff"; statusBar.style.textShadow = "0 0 10px #00d4ff"; });
        targetEntity.addEventListener('targetLost', () => { statusBar.innerText = "SYSTEM SCANNING..."; statusBar.style.color = "var(--amber)"; statusBar.style.textShadow = "0 0 5px var(--amber)"; closePanel(); });

        const panel = document.getElementById('side-panel');
        const pTitle = document.getElementById('info-title');
        const pSub = document.getElementById('info-sub');
        const pDesc = document.getElementById('info-desc');

        document.querySelectorAll('.clickable').forEach(hotspot => {
            hotspot.addEventListener('click', function() {
                pTitle.innerText = this.getAttribute('data-title');
                pSub.innerText = this.getAttribute('data-sub');
                pDesc.innerText = this.getAttribute('data-desc');
                panel.classList.add('open');
            });
        });
        function closePanel() { panel.classList.remove('open'); }
    </script>
</body>
</html>
