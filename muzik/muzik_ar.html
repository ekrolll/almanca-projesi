<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rammstein AR — Deutsche Musik</title>
  <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { overflow:hidden; background:#000; font-family:'Arial',sans-serif; }
    a-scene { width:100vw!important; height:100vh!important; position:fixed!important; top:0!important; left:0!important; }

    #ui { position:fixed; inset:0; pointer-events:none; z-index:1000; }

    #status {
      position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
      background:rgba(6,2,2,.90); color:#cc3300; font-size:.60rem;
      letter-spacing:.28em; text-transform:uppercase; padding:.5rem 1.3rem;
      border:1px solid rgba(200,50,0,.30); backdrop-filter:blur(14px);
      white-space:nowrap; display:flex; align-items:center; gap:.55rem;
      animation:blink 2.5s ease infinite;
    }
    #status.found { color:#ff6633; border-color:rgba(255,100,50,.45); animation:none; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }

    .sbar { width:34px; height:2px; background:rgba(200,50,0,.18); position:relative; overflow:hidden; border-radius:2px; }
    .sbar-fill { position:absolute; top:0; left:-100%; width:100%; height:100%; background:#cc3300; animation:slide 2s linear infinite; }
    #status.found .sbar-fill { background:#ff6633; animation:none; width:100%; left:0; }
    @keyframes slide { 0%{left:-100%} 100%{left:100%} }

    #back {
      position:absolute; top:16px; left:50%; transform:translateX(-50%);
      background:rgba(6,2,2,.90); color:#cc3300;
      border:1px solid rgba(200,50,0,.28); padding:.45rem 1.3rem;
      font-size:.60rem; letter-spacing:.22em; text-transform:uppercase;
      cursor:pointer; pointer-events:all; backdrop-filter:blur(14px); font-family:Arial,sans-serif;
    }
    #tap-hint {
      position:absolute; top:66px; left:50%; transform:translateX(-50%);
      color:rgba(255,100,50,.60); font-size:.58rem; letter-spacing:.25em;
      text-transform:uppercase; display:none; animation:blink 2s ease infinite;
    }

    #info-card {
      position:absolute; bottom:72px; left:50%;
      transform:translateX(-50%) translateY(300px);
      width:min(380px,92vw);
      background:rgba(10,2,2,.94); border:1px solid rgba(200,50,0,.45);
      backdrop-filter:blur(22px); -webkit-backdrop-filter:blur(22px);
      padding:1.3rem 1.5rem;
      transition:transform .42s cubic-bezier(.16,1,.3,1), opacity .42s ease;
      opacity:0; pointer-events:none;
    }
    #info-card.show { transform:translateX(-50%) translateY(0); opacity:1; pointer-events:all; }
    .ic-tag { font-size:.54rem; letter-spacing:.35em; text-transform:uppercase; color:#cc3300; margin-bottom:.42rem; display:flex; align-items:center; gap:.5rem; }
    .ic-tag::after { content:''; flex:1; height:1px; background:rgba(200,50,0,.22); }
    .ic-title { font-size:1.28rem; font-weight:700; color:#f5e8e0; margin-bottom:.22rem; }
    .ic-sub { font-size:.68rem; color:#aa2200; letter-spacing:.1em; margin-bottom:.65rem; }
    .ic-text { font-size:.79rem; color:rgba(245,232,224,.68); line-height:1.68; }
    .ic-close { position:absolute; top:.6rem; right:.8rem; color:rgba(200,50,0,.5); cursor:pointer; font-size:.9rem; pointer-events:all; background:none; border:none; font-family:Arial; }
    .ic-close:hover { color:#cc3300; }
  </style>
</head>
<body>

<a-scene
  mindar-image="imageTargetSrc: targets.mind; autoStart: true; uiLoading: no; uiScanning: no; uiError: no;"
  color-space="sRGB"
  renderer="colorManagement: true; physicallyCorrectLights: true; antialias: true"
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false">

  <!-- IŞIKLAR — kırmızı sahne atmosferi -->
  <a-light type="ambient"     color="#1a0500" intensity="0.8"></a-light>
  <!-- Ana kırmızı spot — üstten -->
  <a-light type="directional" color="#ff2200" intensity="1.4" position="0 2 1"></a-light>
  <!-- Turuncu yan dolgu -->
  <a-light type="directional" color="#ff6600" intensity="0.5" position="-1.5 1 0.5"></a-light>
  <!-- Mavi karşı ışık -->
  <a-light type="directional" color="#2244aa" intensity="0.3" position="1.5 0.5 -1"></a-light>
  <!-- Ateş rengi alt dolgu -->
  <a-light type="point" color="#ff3300" intensity="0.6" position="0 0.3 0.5" distance="3"></a-light>

  <a-camera position="0 0 0" look-controls="enabled: false"
    cursor="fuse: false; rayOrigin: mouse"
    raycaster="objects: .hotspot; far: 100">
  </a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <!-- ══════════════════════════════════════════
         SAHNE ZEMİNİ — siyah mat platform
    ══════════════════════════════════════════ -->
    <a-cylinder position="0 -0.42 0" radius="0.70" height="0.012"
      color="#0a0202" material="roughness:1; metalness:0">
    </a-cylinder>
    <!-- Sahne kenar ışık çizgisi -->
    <a-torus position="0 -0.415 0" radius="0.68" radius-tubular="0.004"
      color="#cc2200" material="roughness:0.5; metalness:0; emissive:#440800; emissiveIntensity:0.8">
    </a-torus>

    <!-- ══════════════════════════════════════════
         ARKA FON — duvar / backdrop
    ══════════════════════════════════════════ -->
    <a-plane position="0 0.05 -0.55" width="1.5" height="0.85"
      color="#080202" material="roughness:1; metalness:0">
    </a-plane>
    <!-- Rammstein logosu çapraz çizgiler (stilize) -->
    <!-- R harfi benzeri iki dikey -->
    <a-box position="-0.14 0.10 -0.54" width="0.012" height="0.28" depth="0.004"
      color="#cc2200" material="roughness:0.4; metalness:0.1; emissive:#440800; emissiveIntensity:0.6">
    </a-box>
    <a-box position="-0.09 0.14 -0.54" width="0.10" height="0.012" depth="0.004"
      color="#cc2200" material="roughness:0.4; metalness:0.1; emissive:#440800; emissiveIntensity:0.6">
    </a-box>
    <a-box position="-0.09 0.10 -0.54" width="0.10" height="0.012" depth="0.004"
      color="#cc2200" material="roughness:0.4; metalness:0.1; emissive:#440800; emissiveIntensity:0.6">
    </a-box>
    <a-box position="-0.04 0.10 -0.54" width="0.012" height="0.12" depth="0.004"
      color="#cc2200" material="roughness:0.4; metalness:0.1; emissive:#440800; emissiveIntensity:0.6">
    </a-box>

    <!-- ══════════════════════════════════════════
         ALEV SÜTUNLARI — sol ve sağ
    ══════════════════════════════════════════ -->

    <!-- Sol alev sütunu -->
    <a-entity position="-0.42 -0.28 0.05"
      animation="property: position; from: -0.42 -0.28 0.05; to: -0.42 -0.26 0.05; dur: 400; easing: easeInOutSine; loop: true; dir: alternate">
      <!-- Ateş alt (turuncu-kırmızı) -->
      <a-cylinder radius="0.028" height="0.20" color="#dd3300"
        material="roughness:0.7; metalness:0; emissive:#660800; emissiveIntensity:0.9"
        position="0 0 0">
      </a-cylinder>
      <!-- Ateş orta (parlak turuncu) -->
      <a-cylinder radius="0.018" height="0.14" color="#ff6600"
        material="roughness:0.5; metalness:0; emissive:#aa2200; emissiveIntensity:1.0"
        position="0 0.05 0"
        animation="property: scale; from: 1 1 1; to: 0.85 1.15 0.85; dur: 300; easing: easeInOutSine; loop: true; dir: alternate">
      </a-cylinder>
      <!-- Ateş uç (sarı) -->
      <a-cone radius-bottom="0.012" radius-top="0.001" height="0.10" color="#ffcc00"
        material="roughness:0.4; metalness:0; emissive:#885500; emissiveIntensity:1.0"
        position="0 0.13 0"
        animation="property: scale; from: 1 1 1; to: 0.7 1.3 0.7; dur: 250; easing: easeInOutSine; loop: true; dir: alternate; delay: 80">
      </a-cone>
    </a-entity>

    <!-- Sağ alev sütunu -->
    <a-entity position="0.42 -0.28 0.05"
      animation="property: position; from: 0.42 -0.28 0.05; to: 0.42 -0.265 0.05; dur: 380; easing: easeInOutSine; loop: true; dir: alternate; delay: 120">
      <a-cylinder radius="0.028" height="0.20" color="#dd3300"
        material="roughness:0.7; metalness:0; emissive:#660800; emissiveIntensity:0.9"
        position="0 0 0">
      </a-cylinder>
      <a-cylinder radius="0.018" height="0.14" color="#ff6600"
        material="roughness:0.5; metalness:0; emissive:#aa2200; emissiveIntensity:1.0"
        position="0 0.05 0"
        animation="property: scale; from: 1 1 1; to: 0.9 1.12 0.9; dur: 320; easing: easeInOutSine; loop: true; dir: alternate; delay: 60">
      </a-cylinder>
      <a-cone radius-bottom="0.012" radius-top="0.001" height="0.10" color="#ffcc00"
        material="roughness:0.4; metalness:0; emissive:#885500; emissiveIntensity:1.0"
        position="0 0.13 0"
        animation="property: scale; from: 1 1 1; to: 0.75 1.25 0.75; dur: 270; easing: easeInOutSine; loop: true; dir: alternate; delay: 40">
      </a-cone>
    </a-entity>

    <!-- Arka sol ek alev -->
    <a-entity position="-0.28 -0.30 -0.18"
      animation="property: position; from: -0.28 -0.30 -0.18; to: -0.28 -0.285 -0.18; dur: 420; easing: easeInOutSine; loop: true; dir: alternate; delay: 200">
      <a-cylinder radius="0.018" height="0.14" color="#cc2200"
        material="roughness:0.7; metalness:0; emissive:#550600; emissiveIntensity:0.8"
        position="0 0 0">
      </a-cylinder>
      <a-cone radius-bottom="0.010" radius-top="0.001" height="0.08" color="#ff8800"
        material="roughness:0.4; metalness:0; emissive:#774400; emissiveIntensity:0.9"
        position="0 0.09 0"
        animation="property: scale; from: 1 1 1; to: 0.8 1.2 0.8; dur: 280; easing: easeInOutSine; loop: true; dir: alternate">
      </a-cone>
    </a-entity>

    <!-- Arka sağ ek alev -->
    <a-entity position="0.28 -0.30 -0.18"
      animation="property: position; from: 0.28 -0.30 -0.18; to: 0.28 -0.288 -0.18; dur: 390; easing: easeInOutSine; loop: true; dir: alternate; delay: 150">
      <a-cylinder radius="0.018" height="0.14" color="#cc2200"
        material="roughness:0.7; metalness:0; emissive:#550600; emissiveIntensity:0.8"
        position="0 0 0">
      </a-cylinder>
      <a-cone radius-bottom="0.010" radius-top="0.001" height="0.08" color="#ff8800"
        material="roughness:0.4; metalness:0; emissive:#774400; emissiveIntensity:0.9"
        position="0 0.09 0"
        animation="property: scale; from: 1 1 1; to: 0.85 1.15 0.85; dur: 300; easing: easeInOutSine; loop: true; dir: alternate; delay: 100">
      </a-cone>
    </a-entity>

    <!-- ══════════════════════════════════════════
         ELEKTRİK GİTAR — sahne solunda
    ══════════════════════════════════════════ -->
    <a-entity position="-0.22 -0.18 0.02"
      animation="property: rotation; from: 0 -15 -12; to: 0 -15 -8; dur: 2200; easing: easeInOutSine; loop: true; dir: alternate">

      <!-- Gitar gövdesi -->
      <a-entity class="hotspot" data-info="guitar" rotation="0 -15 -12">
        <!-- Alt kavisli kısım -->
        <a-cylinder radius="0.060" height="0.018" color="#1a0808"
          material="roughness:0.3; metalness:0.6; emissive:#110303; emissiveIntensity:0.3"
          scale="1 1 0.65" position="0 -0.04 0">
        </a-cylinder>
        <!-- Üst kavisli kısım -->
        <a-cylinder radius="0.048" height="0.018" color="#1a0808"
          material="roughness:0.3; metalness:0.6; emissive:#110303; emissiveIntensity:0.3"
          scale="1 1 0.65" position="0 0.04 0">
        </a-cylinder>
        <!-- Orta bağ -->
        <a-box width="0.072" height="0.05" depth="0.012" color="#150606"
          material="roughness:0.3; metalness:0.6" position="0 0 0">
        </a-box>
        <!-- Ses deliği (pickup) kırmızı parlak -->
        <a-cylinder radius="0.018" height="0.005" color="#cc0000"
          material="roughness:0.2; metalness:0.4; emissive:#660000; emissiveIntensity:0.9"
          position="0 0 0.008">
        </a-cylinder>
        <!-- Köprü -->
        <a-box width="0.055" height="0.006" depth="0.008" color="#888888"
          material="roughness:0.2; metalness:0.9" position="0 -0.025 0.007">
        </a-box>
        <!-- Sap -->
        <a-box width="0.018" height="0.280" depth="0.010" color="#1c0a04"
          material="roughness:0.6; metalness:0.1" position="0 0.200 0">
        </a-box>
        <!-- Sap fret noktası -->
        <a-sphere radius="0.004" color="#cc3300"
          material="roughness:0.3; metalness:0; emissive:#880000; emissiveIntensity:0.8"
          position="0 0.260 0.007">
        </a-sphere>
        <a-sphere radius="0.004" color="#cc3300"
          material="roughness:0.3; metalness:0; emissive:#880000; emissiveIntensity:0.8"
          position="0 0.220 0.007">
        </a-sphere>
        <!-- Tuner başlık -->
        <a-box width="0.030" height="0.025" depth="0.010" color="#1a0808"
          material="roughness:0.4; metalness:0.5" position="0 0.345 0">
        </a-box>
        <!-- Tel pinleri -->
        <a-sphere radius="0.003" color="#aaaaaa" material="roughness:0.2; metalness:0.95" position="-0.008 0.352 0.005"></a-sphere>
        <a-sphere radius="0.003" color="#aaaaaa" material="roughness:0.2; metalness:0.95" position="0.008 0.352 0.005"></a-sphere>
        <!-- Gitar teller -->
        <a-cylinder radius="0.0008" height="0.560" color="#cccccc"
          material="roughness:0.1; metalness:0.98" position="-0.006 0.140 0.009">
        </a-cylinder>
        <a-cylinder radius="0.0008" height="0.560" color="#cccccc"
          material="roughness:0.1; metalness:0.98" position="-0.002 0.140 0.009">
        </a-cylinder>
        <a-cylinder radius="0.0008" height="0.560" color="#aaaaaa"
          material="roughness:0.1; metalness:0.98" position="0.002 0.140 0.009">
        </a-cylinder>
        <a-cylinder radius="0.0010" height="0.560" color="#888888"
          material="roughness:0.1; metalness:0.98" position="0.006 0.140 0.009">
        </a-cylinder>
      </a-entity>

      <a-text value="GİTAR" align="center" position="0 0.46 0"
        scale="0.058 0.058 0.058" color="#cc3300" material="depthTest:false">
      </a-text>
    </a-entity>

    <!-- ══════════════════════════════════════════
         MİKROFON STANDI — sahne merkezi
    ══════════════════════════════════════════ -->
    <a-entity position="0.05 -0.22 0.08"
      animation="property: rotation; from: 0 0 -3; to: 0 0 3; dur: 3000; easing: easeInOutSine; loop: true; dir: alternate">

      <!-- Stand gövdesi (uzun dikey) -->
      <a-cylinder radius="0.006" height="0.38" color="#2a2a2a"
        material="roughness:0.3; metalness:0.85" position="0 0 0">
      </a-cylinder>
      <!-- Stand ayak çatal sol -->
      <a-cylinder radius="0.004" height="0.12" color="#222222"
        material="roughness:0.3; metalness:0.85" position="-0.04 -0.22 0" rotation="0 0 25">
      </a-cylinder>
      <!-- Stand ayak çatal sağ -->
      <a-cylinder radius="0.004" height="0.12" color="#222222"
        material="roughness:0.3; metalness:0.85" position="0.04 -0.22 0" rotation="0 0 -25">
      </a-cylinder>
      <!-- Stand ayak ön -->
      <a-cylinder radius="0.004" height="0.12" color="#222222"
        material="roughness:0.3; metalness:0.85" position="0 -0.22 0.04" rotation="25 0 0">
      </a-cylinder>

      <!-- Mikrofon kafesi (oval) -->
      <a-sphere radius="0.022" scale="1 1.3 1" color="#1a1a1a"
        material="roughness:0.25; metalness:0.90" position="0 0.215 0">
      </a-sphere>
      <!-- Mikrofon ızgara detayı (ring) -->
      <a-torus radius="0.018" radius-tubular="0.002" color="#333333"
        material="roughness:0.2; metalness:0.9" position="0 0.210 0" rotation="90 0 0">
      </a-torus>
      <a-torus radius="0.018" radius-tubular="0.002" color="#333333"
        material="roughness:0.2; metalness:0.9" position="0 0.220 0" rotation="90 0 0">
      </a-torus>
      <!-- Mikrofon kablo bağlantısı -->
      <a-cylinder radius="0.008" height="0.015" color="#333333"
        material="roughness:0.4; metalness:0.7" position="0 0.188 0">
      </a-cylinder>

      <!-- Mikrofon kablo (aşağı sarkan) -->
      <a-cylinder radius="0.003" height="0.18" color="#1a1a1a"
        material="roughness:0.8; metalness:0.2" position="0.015 0.10 0" rotation="0 0 8">
      </a-cylinder>

      <a-text value="MİKROFON" align="center" position="0 0.32 0"
        scale="0.050 0.050 0.050" color="#cc3300" material="depthTest:false">
      </a-text>
    </a-entity>

    <!-- ══════════════════════════════════════════
         RAMMSTEIN BAND ETİKETİ — merkez üst
    ══════════════════════════════════════════ -->
    <a-entity position="0 0.18 -0.10"
      animation="property: position; from: 0 0.18 -0.10; to: 0 0.195 -0.10; dur: 2800; easing: easeInOutSine; loop: true; dir: alternate">

      <a-text class="hotspot" data-info="rammstein"
        value="RAMMSTEIN" align="center" position="0 0 0"
        scale="0.130 0.130 0.130" color="#cc2200"
        material="depthTest:false; emissive:#440800; emissiveIntensity:0.5">
      </a-text>
      <a-text value="NEUE DEUTSCHE HÄRTE · BERLIN · 1994" align="center" position="0 -0.048 0"
        scale="0.038 0.038 0.038" color="rgba(200,50,0,0.70)"
        material="depthTest:false">
      </a-text>

      <!-- Altında ince kırmızı çizgi -->
      <a-box position="0 -0.060 0" width="0.380" height="0.002" depth="0.001"
        color="#cc2200" material="emissive:#660800; emissiveIntensity:0.8">
      </a-box>
    </a-entity>

    <!-- ══════════════════════════════════════════
         DAVUL SETİ — sahne sağında
    ══════════════════════════════════════════ -->
    <a-entity position="0.30 -0.30 -0.10">

      <!-- Büyük bas davul -->
      <a-cylinder class="hotspot" data-info="drums"
        radius="0.068" height="0.055" color="#1a0808"
        material="roughness:0.4; metalness:0.3; emissive:#0a0202; emissiveIntensity:0.2"
        rotation="90 0 0" position="0 0 0">
      </a-cylinder>
      <!-- Bas davul ön yüz kırmızı desen -->
      <a-cylinder radius="0.065" height="0.002" color="#cc0000"
        material="roughness:0.3; metalness:0.1; emissive:#550000; emissiveIntensity:0.7"
        rotation="90 0 0" position="0 0 0.029">
      </a-cylinder>
      <!-- Bas davul orta yuvarlak -->
      <a-cylinder radius="0.030" height="0.003" color="#880000"
        material="roughness:0.3; metalness:0.1; emissive:#330000; emissiveIntensity:0.8"
        rotation="90 0 0" position="0 0 0.031">
      </a-cylinder>

      <!-- Küçük snare davul -->
      <a-cylinder radius="0.038" height="0.028" color="#222222"
        material="roughness:0.3; metalness:0.7"
        rotation="85 0 20" position="-0.08 0.06 0.04">
      </a-cylinder>
      <!-- Snare kenar -->
      <a-torus radius="0.038" radius-tubular="0.003" color="#444444"
        material="roughness:0.2; metalness:0.85"
        rotation="85 0 20" position="-0.08 0.06 0.04">
      </a-torus>

      <!-- Zil (cymbal) -->
      <a-cylinder radius="0.048" height="0.004" color="#b8880a"
        material="roughness:0.2; metalness:0.88"
        rotation="80 0 -15" position="0.06 0.10 0.02"
        animation="property: rotation; from: 80 0 -15; to: 78 0 -15; dur: 600; easing: easeInOutSine; loop: true; dir: alternate">
      </a-cylinder>
      <!-- İkinci zil -->
      <a-cylinder radius="0.035" height="0.003" color="#c09010"
        material="roughness:0.2; metalness:0.88"
        rotation="82 0 25" position="-0.05 0.09 0.05">
      </a-cylinder>

      <a-text value="DAVULLAR" align="center" position="0 0.18 0.04"
        scale="0.048 0.048 0.048" color="#cc3300" material="depthTest:false">
      </a-text>
    </a-entity>

  </a-entity>
</a-scene>

<div id="ui">
  <div id="tap-hint"></div>
  <div id="status">
    <div class="sbar"><div class="sbar-fill"></div></div>
    <span id="status-text"></span>
  </div>
  <button id="back" onclick="window.location.href='index.html'"></button>
  <div id="info-card">
    <button class="ic-close" onclick="closeCard()">&#x2715;</button>
    <div class="ic-tag" id="ic-tag"></div>
    <div class="ic-title" id="ic-title"></div>
    <div class="ic-sub" id="ic-sub"></div>
    <div class="ic-text" id="ic-text"></div>
  </div>
</div>

<script>
  var lang = localStorage.getItem('lang') || 'tr';

  var infos = {
    rammstein: {
      tr: {
        tag: 'Alman Rock Efsanesi',

    de: { status: 'Wird gescannt...', found: '\u2713 Ziel erkannt \u2014 Antippen', hint: '\u25B2 Objekte antippen', back: '\u2190 Zur\u00fcck' }
  };

  var statusEl   = document.getElementById('status');
  var statusText = document.getElementById('status-text');
  var tapHint    = document.getElementById('tap-hint');
  var backBtn    = document.getElementById('back');
  var card       = document.getElementById('info-card');

  statusText.textContent = uiTexts[lang].status;
  tapHint.textContent    = uiTexts[lang].hint;
  backBtn.textContent    = uiTexts[lang].back;

  var target = document.querySelector('[mindar-image-target]');
  target.addEventListener('targetFound', function () {
    statusText.textContent = uiTexts[lang].found;
    statusEl.classList.add('found');
    tapHint.style.display = 'block';
  });
  target.addEventListener('targetLost', function () {
    statusText.textContent = uiTexts[lang].status;
    statusEl.classList.remove('found');
    tapHint.style.display = 'none';
    closeCard();
  });

  document.querySelectorAll('.hotspot').forEach(function (hs) {
    hs.addEventListener('click', function () {
      var key = hs.getAttribute('data-info');
      if (!key || !infos[key]) return;
      var data = infos[key][lang];
      document.getElementById('ic-tag').textContent   = data.tag;
      document.getElementById('ic-title').textContent = data.title;
      document.getElementById('ic-sub').textContent   = data.sub;
      document.getElementById('ic-text').textContent  = data.text;
      card.classList.add('show');
    });
  });

  function closeCard() { card.classList.remove('show'); }
</script>
